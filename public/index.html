<style>
/* Layout: app shell. Navy sidebar on the left, top bar with search, one scrolling sheet per tool.
   Each tool owns a colour (--mc) that tints its header, buttons and icons. */
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface2:#ECEEF8; --fg:#161A33; --muted:#6A7094; --line:#E0E3F1;
  --side:#12163A; --side2:#1B2050; --side-fg:#C6CBF2; --side-mute:#8187BD;
  --c-home:#1B6E66; --c-notes:#D97706; --c-ideas:#E0388A; --c-board:#0E9F6E; --c-mood:#9B51E0; --c-lib:#0284C7; --c-wb:#E5533D; --c-wb:#E5484D; --c-viz:#0F766E;
  --st-i:#8A90B8; --st-m:#5B5BF0; --st-r:#D97706; --st-s:#0E9F6E;
  --on-mc:#FFFFFF; --warn:#C2630A; --danger:#D43F3F; --ok:#0E9F6E;
  --shadow:0 1px 2px rgba(22,26,51,.06),0 10px 28px -14px rgba(22,26,51,.18);
  --f-display:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --mc:var(--c-home);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E24; --surface:#141937; --surface2:#1C2248; --fg:#ECEEFF; --muted:#9AA1D0; --line:#283060;
    --side:#070A1C; --side2:#10153A;
    --c-home:#7C7CFF; --c-notes:#F5A524; --c-ideas:#F06BAE; --c-board:#34D399; --c-mood:#B983F5; --c-lib:#38BDF8; --c-wb:#FF7A59; --c-wb:#FF7A7A; --c-viz:#2DD4BF;
    --st-i:#8F96C4; --st-m:#7C7CFF; --st-r:#F5A524; --st-s:#34D399;
    --on-mc:#0B0E24; --warn:#F5A524; --danger:#F27878; --ok:#34D399;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E24; --surface:#141937; --surface2:#1C2248; --fg:#ECEEFF; --muted:#9AA1D0; --line:#283060;
  --side:#070A1C; --side2:#10153A;
  --c-home:#7C7CFF; --c-notes:#F5A524; --c-ideas:#F06BAE; --c-board:#34D399; --c-mood:#B983F5; --c-lib:#38BDF8; --c-wb:#FF7A59; --c-wb:#FF7A7A; --c-viz:#2DD4BF;
  --st-i:#8F96C4; --st-m:#7C7CFF; --st-r:#F5A524; --st-s:#34D399;
  --on-mc:#0B0E24; --warn:#F5A524; --danger:#F27878; --ok:#34D399;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--mc)}
:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr)}
.col-main{display:flex;flex-direction:column;min-width:0;height:100%}
.col-main[data-v="home"]{--mc:var(--c-home)} .col-main[data-v="notes"]{--mc:var(--c-notes)}
.col-main[data-v="ideas"]{--mc:var(--c-ideas)} .col-main[data-v="board"]{--mc:var(--c-board)}
.col-main[data-v="mood"]{--mc:var(--c-mood)} .col-main[data-v="library"]{--mc:var(--c-lib)}
.col-main[data-v="wb"]{--mc:var(--c-wb)} .col-main[data-v="plan"]{--mc:var(--c-lib)}
.col-main[data-v="viz"]{--mc:var(--c-viz)}
.col-main[data-v="wb"] .wrap{max-width:none}

/* sidebar */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;height:100%;overflow:auto;
  padding:20px 14px 16px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--on-ink,#fff);background:var(--ink-bg,#17171A);flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;color:#fff;letter-spacing:-.01em}
.slbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);padding:0 8px;margin-bottom:6px}
.slist{display:flex;flex-direction:column;gap:2px}
.si-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:7px 8px;border-radius:10px;cursor:pointer;min-width:0}
.si-row:hover{background:var(--side2)}
.si-row[aria-current="true"]{background:var(--side2);color:#fff}
.si-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.si-row .ct{font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border-radius:999px;padding:0 8px;min-width:24px;text-align:center}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c)}
.si-row[aria-current="true"] .tile{background:var(--c);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin:0 10px 0 4px}
.si-row.soon{cursor:default;opacity:.62}
.si-row.soon:hover{background:none}
.si-row.soon .ct{font-size:10px;letter-spacing:.06em;background:transparent;border:1px solid rgba(255,255,255,.25)}
.sadd{margin:4px 0 0 8px}
.sbtn{background:transparent;border:1px dashed rgba(255,255,255,.28);color:var(--side-fg);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;width:calc(100% - 8px);text-align:left}
.sbtn:hover{border-color:#fff;color:#fff}
.sbtn[disabled]{opacity:.5;cursor:not-allowed}
.status{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-mute);padding:0 8px}
.status i{width:8px;height:8px;border-radius:50%;background:#34D399;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mbrand{display:none;align-items:center;gap:8px;min-width:0}
.spsel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:150px;font-weight:600}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.search input{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:9px 12px 9px 38px;min-width:0}
.search input:focus{border-color:var(--mc);background:var(--surface);outline:none}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:15;max-height:60vh;overflow:auto}
.sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover{background:var(--surface2)}
.sres .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);min-width:48px}
.sres .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .none{padding:10px;color:var(--muted);font-size:14px}
.topr{display:flex;align-items:center;gap:8px;margin-left:auto}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.qwrap{position:relative}
.qmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px;z-index:15}
.qmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.qmenu button:hover{background:var(--surface2)}

/* sheet */
.sheet{flex:1;min-height:0;overflow:auto;padding-block:24px 56px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:18px;border:1px solid var(--line);margin-bottom:22px;
  background:linear-gradient(115deg,color-mix(in srgb,var(--mc) 18%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.hero .tile{--c:var(--mc);width:52px;height:52px;border-radius:15px;background:var(--mc);color:var(--on-mc)}
.hero .tile svg.i{width:26px;height:26px}
.hero .txt{flex:1;min-width:180px}
.hero h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--mc);color:var(--mc)}
.btn.pri{background:var(--mc);border-color:var(--mc);color:var(--on-mc)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-mc)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;line-height:1;display:inline-flex}
.ico:hover{color:var(--fg);background:var(--surface2)}
.ico.danger{color:var(--danger)}
.ico[disabled]{opacity:.35;cursor:not-allowed}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{border-color:var(--mc);outline:none}
textarea.in{resize:vertical;min-height:90px}
.ghost{background:transparent;border:0;padding:0;width:100%;min-width:0}
.ghost:focus{outline:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.item:first-of-type{border-top:0}
.item .t{overflow-wrap:anywhere;min-width:0}

.top-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.ringcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring text{font-family:var(--f-display);font-weight:800;font-size:28px;fill:var(--fg)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sq{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:16px;width:100%}
.seg i{display:block;height:100%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--c)}
.stat .tile{width:34px;height:34px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

.notes{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.nlist{display:flex;flex-direction:column;gap:8px;max-height:64vh;overflow:auto}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0;box-shadow:var(--shadow)}
.ncard[aria-current="true"]{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 30%,transparent)}
.ncard b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntitle{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.01em}
.nbody{min-height:44vh;border:0;background:transparent;padding:0;resize:vertical;width:100%;line-height:1.7;font-size:16px;max-width:68ch}
.nbody:focus{outline:none}
.nmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}

.capture{display:flex;gap:10px;margin-bottom:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.capture .in{border:0;background:var(--surface2);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mc);color:var(--on-mc);border-color:var(--mc)}
.tag{font-size:12px;font-weight:600;color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,transparent);border-radius:6px;padding:1px 7px;margin-right:6px}
.idea{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.idea .body{flex:1;min-width:0;overflow-wrap:anywhere}
.idea .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.star{color:var(--muted)}
.star svg{fill:none}
.star[aria-pressed="true"]{color:var(--c-notes)}
.star[aria-pressed="true"] svg{fill:currentColor}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:color-mix(in srgb,var(--sc) 7%,var(--surface2));border-radius:16px;padding:10px;min-height:180px;min-width:0;border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--sc);outline-offset:-2px}
.col h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
.col h3 .cn{font-size:12px;font-weight:700;background:var(--surface);border-radius:999px;padding:0 8px;color:var(--sc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.card.late{border-color:var(--warn)}
.card .ct{font-weight:600;overflow-wrap:anywhere}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.card input[type=date]{background:transparent;border:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0;max-width:128px}
.card.late input[type=date]{color:var(--warn)}
.addtask .in{padding:7px 10px;font-size:14px;background:var(--surface)}

.mood{columns:220px;column-gap:14px}
.frame{break-inside:avoid;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.frame .tagno{position:absolute;top:8px;left:8px;z-index:1;font-family:var(--f-mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.frame .x{position:absolute;top:6px;right:6px;z-index:1;background:var(--surface);border:1px solid var(--line);padding:3px}
.frame img{display:block;width:100%;height:auto}
.frame .sw{height:130px}
.frame .meta{padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.frame .meta .mono{font-size:12px;color:var(--muted)}
.frame .notebox{padding:38px 14px 14px;background:color-mix(in srgb,var(--mc) 10%,var(--surface));white-space:pre-wrap;overflow-wrap:anywhere}
.frame .linkbox{padding:34px 12px 4px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.form > label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0}
.form > label.fix{flex:0 0 auto}
.form input[type=color]{width:56px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pal{display:flex;gap:12px;flex-wrap:wrap}
.pal button{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;width:112px;padding:0;text-align:left;box-shadow:var(--shadow)}
.pal .sw{height:72px}
.pal .hx{font-family:var(--f-mono);font-size:12px;padding:7px 9px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.file .thumb{height:110px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file .meta{padding:8px 12px;font-size:13px;overflow-wrap:anywhere}
.file .foot{display:flex;justify-content:space-between;padding:0 8px 8px 12px;align-items:center}
.sec{margin-top:28px}
.sec > h2{font-size:16px;font-weight:700;margin-bottom:12px}
.note-hint{font-size:13px;color:var(--muted);margin:0 0 12px}

.wbtools{display:flex;gap:6px 4px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.wbtools .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding-right:10px;margin-right:6px;border-right:1px solid var(--line)}
.wbtools .grp:last-child{border-right:0;margin-right:0;padding-right:0}
.tb{min-width:38px;height:38px;padding:0 8px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;display:inline-grid;place-items:center;color:var(--fg);font-size:13px;font-weight:600}
.tb:hover{background:var(--surface2)}
.tb[aria-pressed="true"]{background:var(--mc);color:var(--on-mc)}
.tb[disabled]{opacity:.35;cursor:not-allowed}
.cs{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c);padding:0}
.cs[aria-pressed="true"]{box-shadow:0 0 0 2px var(--mc)}
.wsel{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* polish + v6 */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 40%,transparent) transparent}
:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
.hero{position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 32%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.wrap.enter{animation:vin .35s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.stat,.ncard,.frame,.file,.card{transition:transform .15s,box-shadow .15s,border-color .15s}
.stat:hover,.ncard:hover,.frame:hover,.file:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px color-mix(in srgb,var(--c,var(--mc)) 45%,transparent)}
.card:hover{border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.si-row[aria-current="true"]{box-shadow:inset 3px 0 0 var(--c)}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}

.kcmd{padding:6px 10px}
.card{--pc:transparent;box-shadow:inset 4px 0 0 var(--pc),var(--shadow)}
.card[data-pri="1"]{--pc:var(--c-lib)} .card[data-pri="2"]{--pc:var(--warn)} .card[data-pri="3"]{--pc:var(--danger)}
.pflag{opacity:.4} .pflag[data-p="1"]{color:var(--c-lib);opacity:1} .pflag[data-p="2"]{color:var(--warn);opacity:1} .pflag[data-p="3"]{color:var(--danger);opacity:1}
.ftimer{display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 4px}
.ftimer[data-run="true"]{border-color:var(--c-wb);background:color-mix(in srgb,var(--c-wb) 12%,var(--surface2))}
.ftimer[data-mode="b"][data-run="true"]{border-color:var(--c-board);background:color-mix(in srgb,var(--c-board) 12%,var(--surface2))}

.ftm:hover{color:var(--fg)}
.ftimer .ico{padding:4px}
.cmdk{position:fixed;inset:0;z-index:40;background:rgba(8,10,28,.55);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.palbox{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}

.palit .tile{--c:inherit;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none}

.palit span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Studio theme: frosted glass, black and white, colour kept for data ===== */
:root{
  --bg:#E9E9EC; --surface:rgba(255,255,255,.74); --surface2:rgba(16,16,22,.055); --fg:#0B0B0C; --muted:#6C6C74; --line:rgba(16,16,22,.09);
  --side:transparent; --side2:rgba(16,16,22,.06); --side-fg:#2C2C31; --side-mute:#8A8A92;
  --ink:#0B0B0C; --on-ink:#FFFFFF; --ink-bg:#0B0B0C;
  --shadow:0 1px 1px rgba(16,16,22,.04),0 18px 40px -22px rgba(16,16,22,.28);
  --c-home:#4F46E5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08080A; --surface:rgba(30,30,34,.66); --surface2:rgba(255,255,255,.075); --fg:#F4F4F5; --muted:#9C9CA5; --line:rgba(255,255,255,.1);
    --side:transparent; --side2:rgba(255,255,255,.08); --side-fg:#DCDCE0; --side-mute:#8C8C95;
    --ink:#F4F4F5; --on-ink:#0B0B0C; --ink-bg:#000000;
    --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.8);
    --c-home:#8B8BFF;
  }
}
:root[data-theme="dark"]{
  --bg:#08080A; --surface:rgba(30,30,34,.66); --surface2:rgba(255,255,255,.075); --fg:#F4F4F5; --muted:#9C9CA5; --line:rgba(255,255,255,.1);
  --side:transparent; --side2:rgba(255,255,255,.08); --side-fg:#DCDCE0; --side-mute:#8C8C95;
  --ink:#F4F4F5; --on-ink:#0B0B0C; --ink-bg:#000000;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.8);
  --c-home:#8B8BFF;
}
body{background:radial-gradient(1100px 650px at 12% -8%,color-mix(in srgb,var(--fg) 6%,transparent),transparent 70%),radial-gradient(900px 600px at 100% 105%,color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%),var(--bg)}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1}
body:before{left:-70px;bottom:-90px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff,#d9d9de 55%,#aeaeb6);box-shadow:0 40px 80px -30px rgba(0,0,0,.35)}
body:after{right:-90px;top:-70px;width:340px;height:340px;border-radius:50%;border:56px solid #f5f5f7;
  box-shadow:inset 0 0 40px rgba(0,0,0,.14),inset 0 6px 14px rgba(255,255,255,.9),0 40px 70px -30px rgba(0,0,0,.3)}
:root[data-theme="dark"] body:before{background:radial-gradient(circle at 34% 28%,#4a4a52,#242428 60%,#101013)}
:root[data-theme="dark"] body:after{border-color:#26262b;box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 6px 14px rgba(255,255,255,.12),0 40px 70px -30px #000}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body:before{background:radial-gradient(circle at 34% 28%,#4a4a52,#242428 60%,#101013)}
  :root:not([data-theme="light"]) body:after{border-color:#26262b;box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 6px 14px rgba(255,255,255,.12),0 40px 70px -30px #000}
}

/* floating shell */
.app{padding:14px;gap:14px;grid-template-columns:262px minmax(0,1fr)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);padding:20px 12px 16px 12px}
.col-main{border-radius:30px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 62%,transparent);box-shadow:var(--shadow);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);overflow:hidden}
.logo{background:var(--ink);color:var(--on-ink)}
.brand b{color:var(--fg)}
.slbl{color:var(--side-mute)}
.si-row{border-radius:999px;padding:7px 10px}
.si-row:hover{background:var(--side2)}
.si-row .tile{background:transparent;color:var(--c);width:26px;height:26px}
.si-row[aria-current="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.si-row[aria-current="true"] .tile{background:transparent;color:var(--on-ink)}
.si-row .ct{background:var(--surface2);color:inherit}
.si-row[aria-current="true"] .ct{background:color-mix(in srgb,var(--on-ink) 20%,transparent)}
.si-row.soon .ct{border-color:var(--line)}
.sbtn{border:1px dashed var(--line);color:var(--side-fg);border-radius:999px}
.sbtn:hover{border-color:var(--fg);color:var(--fg)}
.status{color:var(--side-mute)}

/* top bar */
.top{border-bottom:0;background:transparent;padding-block:18px 6px}
.search input{border-radius:999px;background:var(--surface);border:1px solid var(--line);padding:11px 16px 11px 42px;backdrop-filter:blur(12px)}
.search input:focus{border-color:var(--fg);background:var(--surface)}
.date{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;color:var(--fg)}
.topr .ico{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);align-items:center;justify-content:center}
#themebtn{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kcmd{padding:7px 12px}
.ftimer{background:var(--surface);padding:4px 6px}
.ftimer .ico{width:28px!important;height:28px!important;border:0!important;background:none!important}
.sres,.qmenu{border-radius:20px;backdrop-filter:blur(24px);background:color-mix(in srgb,var(--surface) 92%,var(--bg))}

/* buttons */
.btn{border-radius:999px;background:var(--surface);padding:8px 16px}
.btn:hover{border-color:var(--fg);color:var(--fg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:none;opacity:.88;color:var(--on-ink)}
.btn.sm{padding:4px 12px}
.chip{background:var(--surface);padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.in{border-radius:14px;background:var(--surface)}
.in:focus{border-color:var(--fg)}

/* heading instead of hero card */
.hero,.col-main[data-v] .hero{background:none;border:0;box-shadow:none;padding:6px 0 10px;overflow:visible;margin-bottom:16px;gap:14px}
.hero:after{display:none}
.hero .tile,.col-main[data-v] .hero .tile{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);flex:none}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1}
.hero p{font-size:15px;margin-top:8px}

/* glass cards */
.panel,.stat,.ncard,.frame,.file,.vz-tile,.form,.capture,.wbtools,.dlgbox{border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel{padding:22px}
.panel h2{font-size:17px}
.stat:hover,.ncard:hover,.frame:hover,.file:hover{border-color:var(--line)}
.col{border-top:0;border-radius:26px;background:var(--surface2)}
.col h3>span:first-child:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc);margin-right:8px}
.card{border-radius:18px}
.ncard,.idea{border-radius:18px}
.vz-tile{border-radius:24px}
.wbwrap{border-radius:26px}
.ncard[aria-current="true"]{border-color:var(--fg);box-shadow:none}

/* black feature cards */
.panel.ink{background:var(--ink-bg);color:#F4F4F5;border-color:var(--ink-bg);--fg:#F4F4F5;--muted:#A3A3AC;--line:rgba(255,255,255,.14);--surface:rgba(255,255,255,.08);--surface2:rgba(255,255,255,.1);backdrop-filter:none}
.panel.ink .btn{color:#F4F4F5;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}

.search .si{color:var(--fg);opacity:.6}
/* tabbar + mobile */
@media (max-width:860px){
  .app{padding:0;gap:0;grid-template-columns:minmax(0,1fr)}
  .col-main{border-radius:0;border:0;box-shadow:none}
  body:before,body:after{display:none}
  .top{padding-block:12px 4px}
  .tabbar{background:color-mix(in srgb,var(--surface) 88%,var(--bg));backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .tabbar button{border-radius:999px}
  .tabbar button[aria-current="true"]{background:var(--ink);color:var(--on-ink)}
  .hero h1{font-size:clamp(30px,9vw,40px)}
}
/* ===== moodboard v2 ===== */
.mb{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:clamp(18px,3.4vw,44px);box-shadow:var(--shadow);backdrop-filter:blur(14px);font-family:var(--fb)}
.mb-head{text-align:center;padding-bottom:26px}
.mb-kick{font-size:12px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.mb-title{font-family:var(--fh);font-weight:var(--fhw);font-size:clamp(40px,8vw,92px);line-height:1;letter-spacing:-.02em;margin:14px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.mb-tag{font-size:clamp(12px,1.6vw,16px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.mb-about{max-width:62ch;margin:16px auto 0;color:var(--muted)}
.mb-kw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;align-items:center}
.mb-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--surface2)}
.mb-chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px;font-size:16px;line-height:1}
.mb-kwin{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:13px;min-width:170px}
.mb-kwin:focus{outline:none;border-color:var(--fg)}
.mb-form{background:var(--surface2);border-radius:20px;padding:14px;margin:0 0 16px;align-items:flex-end}
.mb-empty{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:1px dashed var(--line);border-radius:22px;padding:22px;margin-bottom:10px}
.mb-empty span{color:var(--muted);max-width:50ch;font-size:14px}
.mb-sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding:26px 0}
.mb-lbl h3{font-family:var(--fh);font-weight:var(--fhw);font-size:22px;letter-spacing:-.01em}
.mb-lbl p{margin:4px 0 12px;font-size:13px;color:var(--muted)}
.mb-add{display:flex;flex-wrap:wrap;gap:6px}
.mb-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.mb-none{color:var(--muted);font-size:14px;padding:10px 0}
.mb-it{position:relative;margin:0;min-width:0}
.mb-ctl{position:absolute;top:6px;right:6px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;opacity:0;transition:opacity .15s;z-index:2}
.mb-ctl .ico{padding:4px;width:26px;height:26px;justify-content:center;border-radius:50%}
.mb-ctl svg.i{width:14px;height:14px}
.mb-it:hover .mb-ctl,.mb-it:focus-within .mb-ctl{opacity:1}
@media (hover:none){.mb-ctl{opacity:1}}
.mb-it figcaption{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.k-color{flex:1 1 88px;max-width:150px}
.mb-sw{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:100%;height:150px;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;cursor:pointer}
.mb-sw .hex{font:600 12px var(--f-mono);letter-spacing:.04em}
.mb-sw .nm{font-size:12px;opacity:.85}
.mb-sw:hover{transform:translateY(-3px)}
.k-image,.k-pattern{width:clamp(130px,22%,210px);flex:0 0 auto}
.mb-img{border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--surface2);border:1px solid var(--line)}
.mb-img img{display:block;width:100%;height:100%;object-fit:cover}
.s-logo .mb-img{aspect-ratio:1;background:#fff}.s-logo .mb-img img{object-fit:contain;padding:10px}
.mb-pat{border-radius:18px;aspect-ratio:1;border:1px solid var(--line)}
.k-quote{flex:1 1 280px;max-width:480px}
.mb-quote{margin:0;background:var(--ink-bg);color:#F4F4F5;border-radius:22px;padding:22px 24px;position:relative}
.mb-quote .qm{font-family:var(--fh);font-size:56px;line-height:.6;opacity:.5;display:block;height:22px}
.mb-quote p{margin:0;font-family:var(--fh);font-size:clamp(18px,2.2vw,24px);line-height:1.3}
.mb-quote cite{display:block;margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-style:normal}
.k-note{flex:1 1 220px;max-width:340px}
.mb-note{background:color-mix(in srgb,var(--c-notes) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c-notes) 25%,var(--line));border-radius:6px 18px 18px 18px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.k-icon{flex:0 0 auto}
.mb-ico{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
.mb-ico span{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center}
.mb-ico svg.i{width:28px;height:28px;stroke-width:1.5}
.mb-ico small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.k-link{flex:1 1 220px;max-width:320px}
.mb-link{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--fg);background:var(--surface2)}
.mb-link small{color:var(--muted);font-family:var(--f-mono)}
.mb-type{display:grid;grid-template-columns:150px 150px minmax(0,1fr);gap:14px;align-items:stretch}
.mb-tc{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;background:var(--surface2)}
.mb-tc .aa{font-size:56px;line-height:1.05}
.mb-tc small{color:var(--muted);font-size:12px}
.mb-ts{border:1px solid var(--line);border-radius:20px;padding:18px}
.mb-ts .h{font-size:clamp(22px,3vw,34px);line-height:1.15}
.mb-ts p{margin:10px 0 0;color:var(--muted);font-size:14px}
/* collage */
.mb-addrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.mb-collage{columns:230px;column-gap:18px;padding:10px 6px}
.mb-collage .mb-it{break-inside:avoid;margin:0 0 22px;transform:rotate(var(--r));transition:transform .2s;width:100%;max-width:none;flex:none}
.mb-collage .mb-it:hover{transform:rotate(0) scale(1.02);z-index:3}
.mb-collage .k-image{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45);color:#222}
.mb-collage .k-image .mb-img{border-radius:2px;aspect-ratio:auto;border:0}
.mb-collage .k-image figcaption{font-family:var(--fh);font-style:italic;font-size:14px;color:#444;text-align:center;margin-top:8px}
.mb-collage .k-image:before,.mb-collage .k-note:before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(214,196,160,.6);z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mb-collage .k-note{background:none}
.mb-collage .mb-note{border-radius:4px;box-shadow:0 12px 24px -14px rgba(0,0,0,.4);padding:22px 16px 16px}
.mb-collage .k-color{max-width:none}
.mb-collage .mb-sw{height:110px}
.mb-collage .mb-pat{box-shadow:0 12px 24px -14px rgba(0,0,0,.4)}
.mb-collage .k-icon{display:flex;justify-content:center}
.mb-collage .k-type .mb-type{grid-template-columns:1fr 1fr}.mb-collage .k-type .mb-ts{grid-column:1/-1}
.mb-collage .k-type{background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:14px}
@media (max-width:860px){
  .mb-sec{grid-template-columns:minmax(0,1fr);gap:14px}
  .mb-type{grid-template-columns:1fr 1fr}.mb-ts{grid-column:1/-1}
  .k-image,.k-pattern{width:calc(50% - 6px)}
}
/* ===== planner + notes sections ===== */

.clk{width:116px;height:116px;flex:none}

@media (max-width:1000px){.plan{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.pst{display:none}.clkcard{flex-direction:column;align-items:flex-start}}

.ag-card h1{font:800 28px/1.15 var(--f-display);margin:0 0 6px;letter-spacing:-.02em}
.ag-sub{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.ag-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface2);margin-bottom:16px}
.ag-tabs[hidden]{display:none}
.ag-tabs button{border:0;background:none;border-radius:999px;padding:9px 10px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.ag-tabs button[aria-pressed="true"]{background:var(--ink-bg,#17171A);color:var(--on-ink,#fff)}
#agform{display:flex;flex-direction:column;gap:12px}
#agform label{display:flex;flex-direction:column;gap:6px;font:600 13px var(--f-body);color:var(--muted)}
#agform label[hidden]{display:none}
#agform input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:13px 14px;font:500 16px var(--f-body);outline:none}
#agform input:focus{border-color:var(--fg)}
.ag-msg{min-height:20px;margin:0;font-size:13.5px;color:#DC2626}.ag-msg.ok{color:#0E9F6E}
.ag-go{width:100%;justify-content:center;padding:13px 16px;font-size:15px}
.ag-foot{display:flex;justify-content:center;margin-top:10px}
.ag-link{border:0;background:none;color:var(--muted);font:500 13.5px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ag-link[hidden]{display:none}
/* public page */
#pubpage{min-height:100vh}
.pp-wrap{max-width:640px;margin:0 auto;padding:32px 16px 48px;--pa:#12163A}
.pp-card{background:var(--solid,var(--surface));border:1px solid var(--line);border-radius:26px;padding:26px 24px;box-shadow:var(--shadow)}
.pp-load{text-align:center;color:var(--muted)}
.pp-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.pp-av{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--pa);color:#fff;display:grid;place-items:center;font:800 28px var(--f-display)}
.pp-card h1{font:800 26px/1.15 var(--f-display);margin:0;letter-spacing:-.02em}
.pp-handle{margin:2px 0 0;color:var(--muted);font-size:14px}
.pp-tag{font:600 16px var(--f-body);margin:6px 0}.pp-bio{margin:8px 0 0;color:var(--muted);line-height:1.55;white-space:pre-wrap}.pp-sub{color:var(--muted)}
.pp-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pp-link{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--pa);color:#fff;text-decoration:none;font:600 14px var(--f-body)}
.pp-h{font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
.pp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pp-stat{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.pp-stat b{font:800 28px var(--f-display);letter-spacing:-.02em}.pp-stat small{color:var(--muted)}
.pp-pl{font:700 12px var(--f-display);color:var(--pa)}.pp-meta,.pp-asof{font-size:12.5px;color:var(--muted)}
.pp-vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pp-vid{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg);font-size:13.5px}
.pp-vid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--surface2)}.pp-vid small{color:var(--muted)}
.pp-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.pp-foot a{color:inherit}
/* audience */
.aud-add,.aud-setup{margin-bottom:16px}.aud-add h3,.aud-setup h3,.cp-form h3,.cp-side h3{font:700 16px var(--f-display);margin:0 0 12px}
.aud-setup ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.aud-setup p{margin:0;color:var(--muted)}
.aud-plats,.aud-kind{display:flex;flex-wrap:wrap;gap:8px}
.aud-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px}
.aud-f{display:flex;flex-direction:column;gap:6px;font:600 13px var(--f-body);color:var(--muted);flex:2 1 260px}.aud-f.sm{flex:1 1 110px}
.aud-hint{font-size:12.5px;margin:10px 0 0}.aud-msg{min-height:20px;font-size:13.5px;color:var(--muted);margin:0 0 10px}
.aud-h{font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 10px}
.aud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.aud-empty{display:flex;flex-direction:column;gap:6px;padding:28px;border:1px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted)}.aud-empty b{color:var(--fg);font:700 16px var(--f-display)}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.ac-h{display:flex;align-items:center;gap:12px}.ac-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--f-display)}
.ac-t{display:flex;flex-direction:column;min-width:0;flex:1}.ac-t b{font:700 15px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-t span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.ac-dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.ac-up{font-size:12px;color:var(--muted);white-space:nowrap}.ac-err{color:#DC2626;font-weight:600}
.ac-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac-stats>div{display:flex;flex-direction:column;gap:1px;min-width:0}.ac-stats b{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em}.ac-stats small{color:var(--muted);font-size:12.5px}
.dl{font-style:normal;font-size:12px;color:var(--muted)}.dl.up{color:#0E9F6E}.dl.down{color:#DC2626}
.ac-sp{display:flex;flex-direction:column;gap:2px}.ac-sp small,.ac-note{color:var(--muted);font-size:12px;margin:0}
.ac-errmsg{color:#DC2626;font-size:13px;margin:0}
.ac-vids h4{font:700 12px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.ac-v{display:grid;grid-template-columns:64px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;text-decoration:none;color:var(--fg);border-top:1px solid var(--line);font-size:13px}
.ac-v img,.ac-vph{width:64px;height:36px;border-radius:8px;object-fit:cover;background:var(--surface2)}
.ac-vt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ac-vn{color:var(--muted);font-size:12px;white-space:nowrap}
.ac-man{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.ac-man label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-body);color:var(--muted);flex:1 1 90px}
.ac-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}.ac-pub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-right:auto}
@media (max-width:560px){.ac-v{grid-template-columns:56px 1fr auto}.ac-v .ac-vn:last-child{display:none}.ac-stats b{font-size:22px}}
/* creator page */
.cp-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cp-grid{grid-template-columns:1fr}}
.cp-form{display:flex;flex-direction:column;gap:12px}.cp-side{display:flex;flex-direction:column;gap:14px}
.cp-form textarea{resize:vertical;font-family:inherit}
.cp-pre{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}.cp-pre i{font-style:normal;padding:0 0 0 14px;color:var(--muted)}.cp-pre input{border:0!important;flex:1;min-width:0}
.cp-lr{display:flex;gap:8px;margin:6px 0}.cp-lr input:first-child{flex:1 1 30%}.cp-lr input:nth-child(2){flex:2 1 50%}
.cp-pub{display:flex;align-items:center;gap:8px;font-size:14px}
.cp-pv{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.cp-av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--pa);color:#fff;display:grid;place-items:center;font:800 22px var(--f-display);margin-bottom:6px}
.cp-pv b{font:800 18px var(--f-display)}.cp-h,.cp-tg{color:var(--muted);font-size:13.5px}.cp-pv p{margin:6px 0 0;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.cp-ls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cp-ls span{background:var(--pa);color:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.cp-url{word-break:break-all;font:500 13px var(--f-mono);margin:0 0 10px}
.av img{width:100%;height:100%;object-fit:cover}
a.btn{text-decoration:none;color:var(--fg)}

.ac-goal{display:flex;flex-direction:column;gap:6px;padding:10px 0 2px;border-top:1px solid var(--line,rgba(0,0,0,.08));margin-top:8px}
.ac-goal.ed{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:8px}.ac-goal.ed label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-body);color:var(--muted);flex:1 1 120px}
.ag-t{display:flex;justify-content:space-between;font:600 13px var(--f-body)}
.ag-bar{height:8px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden}.ag-bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.ac-goal small{color:var(--muted)}.ac-goal .btn{align-self:flex-start}

/* Frost: black and white liquid glass. Loaded last, so it wins over the older theme layers.
   Colour is kept only for data (charts, deltas, status dots). */
@font-face{font-family:"Geist";src:url(/geist.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --f-display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist",ui-sans-serif,system-ui,sans-serif;
  --bg:#E7E7EA; --fg:#000; --muted:#6C6C72;
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.72); --flat:rgba(0,0,0,.045); --flat2:rgba(0,0,0,.07);
  --surface:var(--glass); --surface2:var(--flat); --line:rgba(0,0,0,.085); --edge:rgba(255,255,255,.9);
  --ink:#000; --on-ink:#fff; --ink-bg:#000; --solid:#F6F6F8; --solid2:#EAEAEE;
  --lift:0 1px 0 var(--edge) inset,0 0 0 .5px rgba(255,255,255,.5) inset,0 20px 44px -26px rgba(0,0,0,.28);
  --shadow:var(--lift); --mc:#000; --c-home:#000;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050505; --fg:#fff; --muted:#9A9AA2;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --flat:rgba(255,255,255,.06); --flat2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.1); --edge:rgba(255,255,255,.2);
  --ink:#fff; --on-ink:#000; --ink-bg:#fff; --solid:#17171A; --solid2:#222226; --c-home:#fff;
  --lift:0 1px 0 var(--edge) inset,0 24px 48px -28px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#050505; --fg:#fff; --muted:#9A9AA2;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --flat:rgba(255,255,255,.06); --flat2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.1); --edge:rgba(255,255,255,.2);
  --ink:#fff; --on-ink:#000; --ink-bg:#fff; --solid:#17171A; --solid2:#222226; --c-home:#fff;
  --lift:0 1px 0 var(--edge) inset,0 24px 48px -28px rgba(0,0,0,.9);
}
:root[data-theme="dark"],:root:not([data-theme="light"]){--surface:var(--glass);--surface2:var(--flat);--shadow:var(--lift)}
:root[data-theme="light"]{--surface:var(--glass);--surface2:var(--flat);--shadow:var(--lift)}

html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:15px;font-feature-settings:"tnum" 1,"ss01" 1;letter-spacing:-.006em;background:var(--bg)}
.col-main[data-v]{--mc:var(--fg)}
a{color:var(--fg);text-underline-offset:3px}
h1,h2,h3{font-weight:560;letter-spacing:-.02em}
svg.i{stroke-width:1.55}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* backdrop: soft light for the glass to pick up, no objects */
body:before,body:after{position:fixed;content:"";pointer-events:none;z-index:-1;border-radius:50%;filter:blur(70px);border:0;box-shadow:none}
body:before{left:-12vw;top:-18vh;width:56vw;height:56vw;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
body:after{right:-14vw;bottom:-22vh;width:62vw;height:62vw;background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,0) 66%)}
:root[data-theme="dark"] body:before,:root:not([data-theme="light"]) body:before{background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 68%)}
:root[data-theme="dark"] body:after,:root:not([data-theme="light"]) body:after{background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,0) 66%)}
:root[data-theme="light"] body:before{background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
:root[data-theme="light"] body:after{background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,0) 66%)}

/* glass surfaces */
.side,.col-main,.panel,.dlgbox,.palbox,.qmenu,.bellm,.sres,.pmenu,.profm,.acard,.ag-card,.pp-card,.msheet-box,.tabbar{
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--line);box-shadow:var(--lift)}
.palbox,.dlgbox,.qmenu,.bellm,.sres,.pmenu,.profm{background:var(--solid)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.col-main{border-radius:var(--r-lg);background:var(--glass)}
.side{border-radius:var(--r-lg);gap:18px}
.panel,.acard{border-radius:var(--r-md);padding:20px}
.panel h2,.panel h3{font-size:15px;font-weight:560;color:var(--fg)}

/* inside a glass panel, things are flat, not boxes in boxes */
.stat,.ncard,.frame,.file,.vz-tile,.form,.capture,.wbtools,.card,.bn-card,.drp,.dstat,.dimp{
  background:var(--flat);border:0;box-shadow:none;border-radius:var(--r-sm);backdrop-filter:none;-webkit-backdrop-filter:none;background-image:none}
.stat:hover,.ncard:hover,.frame:hover,.file:hover{transform:none;background:var(--flat2);box-shadow:none}
.vz-tile .vt-ic,.stat .tile{display:none}
.vz-tile{background-image:none!important}
.vt-bar{background:var(--flat2)}
.panel.ink{background:var(--ink-bg);color:var(--on-ink);border-color:transparent;--fg:var(--on-ink);--muted:color-mix(in srgb,var(--on-ink) 62%,transparent);--line:color-mix(in srgb,var(--on-ink) 16%,transparent)}

/* sidebar */
.brand b{font-weight:600;font-size:16px;letter-spacing:-.02em;color:var(--fg)}
.logo{border-radius:11px;background:var(--ink);color:var(--on-ink)}
.slbl,.palg{font:500 12px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted);padding:10px 12px 4px}
.si-row{border-radius:14px;padding:8px 12px;color:var(--fg);font-weight:450;transition:background .18s var(--ease)}
.si-row .tile,.palit .tile,.qmenu .tile,.tabbar svg{background:none!important;color:var(--muted)!important}
.si-row:hover{background:var(--flat)}
.si-row[aria-current="true"]{background:var(--glass2);color:var(--fg);box-shadow:0 1px 0 var(--edge) inset,0 0 0 1px var(--line)}
.si-row[aria-current="true"] .tile{color:var(--fg)!important}
.si-row .ct,.si-row .nm+.ct{background:none;color:var(--muted);font-size:12px}
.si-row .dot{background:var(--fg)!important;width:6px;height:6px}
.pcard{border-radius:16px;background:var(--flat);border:0}
.pcard:hover{background:var(--flat2)}
button.status:hover{background:var(--flat)}

/* top bar */
.top{padding-block:16px 4px}
.top .search input,.search input{border-radius:999px;background:var(--flat);border:0;box-shadow:none}
.ftimer{background:var(--flat)!important;border:0!important}
.ftimer[data-run="true"]{background:var(--ink)!important;color:var(--on-ink)}
.ftb{background:var(--ink)!important;color:var(--on-ink)!important}
.ftimer[data-run="true"] .ftb{background:var(--on-ink)!important;color:var(--ink)!important}
#today{display:none}
.ico{background:var(--flat);border:0;border-radius:50%;box-shadow:none}
.ico:hover{background:var(--flat2)}
kbd,.kcmd{background:var(--flat);border:0;font-family:var(--f-body);color:var(--muted)}

/* page heading: quiet, typographic */
.hero{padding:10px 0 6px;margin-bottom:20px}
.hero .tile{display:none!important}
.hero h1,.col-main[data-v] .hero h1{font-size:clamp(28px,3.4vw,40px);font-weight:540;letter-spacing:-.035em;line-height:1.05}
.hero p{font-size:14.5px;margin-top:8px;color:var(--muted)}

/* controls */
.btn{border-radius:999px;background:var(--flat);border:0;box-shadow:none;color:var(--fg);font-weight:500;transition:background .18s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--flat2)}
.btn:active{transform:scale(.98)}
.btn.pri,.btn[class*="pri"]{background:var(--ink);color:var(--on-ink)}
.btn.pri:hover{background:var(--ink);opacity:.86}
.btn[disabled]{opacity:.45}
a.btn{color:var(--fg)}a.btn.pri{color:var(--on-ink)}
.chip,.vseg-btn,.pseg button{border-radius:999px;border:0;background:var(--flat);color:var(--fg);transition:background .18s var(--ease)}
.chip:hover{background:var(--flat2)}
.chip[aria-pressed="true"],.chip.on,.chip[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.in,input.in,textarea.in,select.in,.cp-pre{border-radius:14px;background:var(--flat);border:1px solid transparent;box-shadow:none;transition:border-color .18s,background .18s}
.in:focus,.cp-pre:focus-within{outline:none;border-color:var(--fg);background:var(--glass2)}
.cp-pre input{background:none;border:0}
input[type="checkbox"]{accent-color:var(--ink)}

/* data keeps colour; chrome around it does not */
.vz-tile b,.stat b,.bn-num,.vz-num{font-weight:520;letter-spacing:-.03em}
.ac-stats b{font-weight:520;letter-spacing:-.03em}
.ag-bar{background:var(--flat2)}.ag-bar i{background:var(--fg)}
.acard .ac-dot,.ac-dot{background:var(--c)}

/* motion: only what answers a click, short */
.wrap.enter{animation:fadein .22s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sign-in and public page */
html.authing body,html.pubpage body{background:var(--bg)}
.ag-card,.pp-card{border-radius:30px;background:var(--glass);box-shadow:var(--lift)}
.ag-card h1,.pp-card h1{font-weight:540;letter-spacing:-.035em}
.ag-tabs{background:var(--flat)}.ag-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pp-h,.aud-h,.dh{font:500 13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.pp-link{background:var(--ink);color:var(--on-ink)}
.pp-av{background:var(--ink);color:var(--on-ink)}
.pp-stat{border:0;background:var(--flat);border-radius:var(--r-md)}.pp-pl{color:var(--muted)}
.cp-av,.av{background:var(--ink)!important;color:var(--on-ink)!important}
.cp-ls span{background:var(--ink);color:var(--on-ink)}

/* overview */
.pcard{background:var(--solid)!important}
.bn-pill{border:0}
.bn-pill.post{background:var(--flat);color:var(--fg)}
.bn-day{border-bottom:1px solid var(--line)}
.bn-file{border:0;background:var(--flat);border-radius:14px;font-weight:500}
.bn-file:hover{background:var(--flat2)}
.bn-big,.bn-st b,.bn-tl b{font-weight:520;letter-spacing:-.035em}
.bn-orbwrap{background:var(--flat2)}
.bn-orb{width:34%;background:none;box-shadow:none;border:1.5px solid color-mix(in srgb,var(--fg) 28%,transparent)}
.bn-chip{background:var(--flat);font-weight:500}
.item{border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}

/* ===== handles ===== */
.hd-list{display:flex;flex-direction:column;gap:2px;margin:4px 0 0}
.hd-row{display:grid;grid-template-columns:116px minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 0}
.hd-row b{font-weight:500;font-size:14.5px}
.hd-row .cp-pre{min-height:42px}
.hd-row .cp-pre i{padding-left:14px;color:var(--muted);font-style:normal}
.hd-row .btn{padding:8px 14px;font-size:13px}
.hd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd-url{font-size:15px;font-weight:500;word-break:break-all}
.hd-seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--flat)}
.hd-seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font:500 13.5px var(--f-body);color:var(--muted);cursor:pointer}
.hd-seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* ===== phone ===== */
.msheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.msheet[hidden]{display:none}
.msheet-box{width:100%;max-height:82vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--solid)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.msheet-box:before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--flat2);margin:2px auto 14px}
.ms-g{font:500 12px var(--f-body);color:var(--muted);margin:14px 4px 6px}
.ms-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ms-grid button,.ms-row button{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--flat);color:var(--fg);padding:13px 14px;font:500 15px var(--f-body);text-align:left;cursor:pointer;min-height:48px}
.ms-grid button[aria-current="true"]{background:var(--ink);color:var(--on-ink)}
.ms-grid svg.i{color:currentColor!important}
.ms-row{display:flex;flex-direction:column;gap:6px;margin-top:6px}

@media (max-width:860px){
  html,body{background:var(--bg)}
  .app{padding:0;gap:0;display:block;height:100%}
  .side{display:none}
  .col-main{border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;height:100%}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand act" "search search";gap:10px 8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 4px;align-items:center}
  .mbrand{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0}
  .mbrand .logo{width:34px!important;height:34px!important}
  .spsel{font:560 18px var(--f-display);letter-spacing:-.02em;background:none;border:0;max-width:60vw;padding:0;color:var(--fg)}
  .topr{grid-area:act;display:flex;gap:8px;align-items:center;margin:0}
  .topr>*{display:none!important}
  .topr>.qwrap{display:block!important}
  .topr .qwrap .btn.pri{width:42px;height:42px;padding:0;justify-content:center;font-size:0}
  .topr .qwrap .btn.pri #plusico svg{width:20px;height:20px}
  .search{grid-area:search;width:100%;max-width:none}
  .search input{height:44px;font-size:16px}
  .sheet{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .wrap{padding:6px 16px 0}
  .hero{margin-bottom:12px}
  .hero h1,.col-main[data-v] .hero h1{font-size:30px}
  .panel{padding:16px;border-radius:22px}
  .tabbar{display:grid!important;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;
    padding:6px;gap:2px;border-radius:30px;overflow:visible;height:auto}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;border:0;border-radius:24px;background:none;color:var(--muted);
    font:500 10.5px var(--f-body);letter-spacing:0;min-width:0;padding:0;transition:background .18s var(--ease),color .18s}
  .tabbar button svg{width:21px;height:21px;color:currentColor!important}
  .tabbar button[aria-current="true"]{background:var(--glass2);color:var(--fg);box-shadow:0 1px 0 var(--edge) inset,0 0 0 1px var(--line)}
  .hd-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n b" "i i"}
  .hd-row b{grid-area:n}.hd-row .btn{grid-area:b}.hd-row .cp-pre{grid-area:i}
  .cp-grid{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:861px){.msheet{display:none!important}}

/* public page */
.pp-wrap{max-width:720px;padding-top:56px}
.pp-card{padding:34px 32px 30px}
.pp-head{gap:18px;margin-bottom:18px}
.pp-av{width:84px;height:84px}
.pp-card h1{font-size:34px}
.pp-tag{font-size:18px;font-weight:450;margin:10px 0 4px}
.pp-links{margin-top:20px}
.pp-link{padding:10px 18px;font-weight:500}
.pp-stat b{font-size:32px;font-weight:520}
@media (max-width:560px){.pp-wrap{padding-top:20px}.pp-card{padding:26px 20px}.pp-card h1{font-size:28px}}

/* ===== sidebar rail ===== */
.brand{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;padding:4px 6px;border-radius:16px;transition:background .2s var(--ease)}
.brand:hover{background:var(--flat)}
.brand b{flex:1;white-space:nowrap}
.rail-ic{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--muted);flex:none;transition:transform .42s var(--ease)}
.rail-ic svg{width:16px;height:16px}
.logo.pop{animation:logopop .55s var(--ease)}
@keyframes logopop{0%{transform:scale(.84) rotate(-14deg)}60%{transform:scale(1.07) rotate(3deg)}100%{transform:none}}
@media (min-width:861px){
  .app{transition:grid-template-columns .45s var(--ease)}
  .app.rail{grid-template-columns:86px minmax(0,1fr)}
  .side{overflow-x:hidden;transition:padding .45s var(--ease)}
  .side .nm,.side .ct,.brand b,.sadd,.pcard .pt,.pcard .pc,.status span,.slbl{transition:opacity .22s var(--ease),max-width .45s var(--ease),margin .45s var(--ease)}
  .side .nm,.brand b{max-width:190px}
  .app.rail .side{padding-left:13px;padding-right:13px;align-items:center}
  .app.rail .side>div,.app.rail .side .slist{width:100%}
  .app.rail .brand{justify-content:center;padding:4px}
  .app.rail .brand b,.app.rail .rail-ic{display:none}
  .app.rail .nm,.app.rail .ct,.app.rail .sadd,.app.rail .pcard .pt,.app.rail .pcard .pc,.app.rail .status span{opacity:0;max-width:0;overflow:hidden;margin:0;pointer-events:none;white-space:nowrap}
  .app.rail .si-row{justify-content:center;gap:0;padding:0;height:42px;width:42px;margin:1px auto;border-radius:16px;position:relative}
  .app.rail .si-row .ct,.app.rail .si-row .nm{display:none}
  .app.rail .si-row .tile{width:22px;height:22px;background:none!important;color:inherit;display:grid;place-items:center}
  .app.rail .si-row .tile svg{width:20px;height:20px}
  .app.rail .si-row[aria-current="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
  .app.rail .si-row.soon{display:none}
  .app.rail .si-row .tile,.app.rail .si-row .tile svg,.app.rail .si-row .tile svg *{color:inherit!important;stroke:currentColor}
  .app.rail .si-row{color:var(--muted)}
  .app.rail .si-row:hover{color:var(--fg);background:var(--flat)}
  .app.rail .si-row[data-act="space"],.app.rail .si-row[data-act="space"][aria-current="true"]{background:var(--flat);color:var(--fg)}
  .app.rail .si-row[data-act="space"] .dot{width:10px;height:10px;box-shadow:0 0 0 4px var(--flat2)}
  .app.rail .brand{width:46px;height:46px;margin:2px auto 8px;padding:0;border-radius:16px}
  .app.rail .brand .logo{margin:0}
  .app.rail .si-row .tile{width:auto}
  .app.rail .si-row .dot{margin:0}
  .app.rail .slbl{font-size:0;padding:0;margin:10px 16px;height:1px;background:var(--line);width:auto}
  .app.rail .pcard{justify-content:center;padding:6px;gap:0;width:auto}
  .app.rail button.status{justify-content:center;width:auto}
}
.rail .rail-ic{transform:rotate(180deg)}

/* top bar: where you are */
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 4px 0 6px}
.crumb i{font-style:normal;opacity:.5}
.crumb b{color:var(--fg);font-weight:560}
@media (max-width:860px){.crumb{display:none}}

/* ===== Create tools ===== */
/* shared */
.chips{margin:6px 0 18px}
.empty{color:var(--muted);padding:28px 4px;background:none;border:0}

/* notes */
.ntpl{margin:0 0 22px;gap:8px}
.ntpl>span{margin-right:2px}
.ntpl .chip{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.ntpl .chip:hover{background:var(--flat)}
.notes{grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:22px}
#nsearch{border-radius:999px;padding:11px 18px;margin-bottom:12px!important}
.nlist{gap:2px;padding-right:2px}
.ncard{background:none;border:0;box-shadow:none;border-radius:16px;padding:12px 14px;transition:background .18s var(--ease)}
.ncard:hover{background:var(--flat)}
.ncard[aria-current="true"]{background:var(--glass2);box-shadow:0 1px 0 var(--edge) inset,0 0 0 1px var(--line)}
.ncard b{font-weight:560;font-size:15px}
.ncard span{margin-top:2px}
#neditor>.panel{padding:26px 34px 30px;border-radius:var(--r-lg);min-height:60vh}
.nmeta{border:0;margin:0 0 10px;padding:0;font-size:13px}
.nmeta .btn{padding:7px 14px;font-size:13px}
.nout .chip{background:var(--flat)}
.ntool{gap:4px;margin:0 0 18px;padding:4px;border-radius:999px;background:var(--flat);width:fit-content;max-width:100%}
.ntool .btn{background:none;padding:6px 12px;font-size:13px}
.ntool .btn:hover{background:var(--glass2)}
.ntitle{font-size:32px;font-weight:540;letter-spacing:-.035em;margin:0 0 8px}
.nbody{font-size:16.5px;line-height:1.75;max-width:66ch;color:color-mix(in srgb,var(--fg) 88%,transparent)}

/* ideas */
.capture{display:flex;gap:10px;padding:8px 8px 8px 22px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--lift);margin-bottom:14px;align-items:center}
.capture .in{background:none;border:0;font-size:17px;padding:10px 0}
.capture .in:focus{background:none}
.capture .btn.pri{padding:12px 24px}
.idea{display:flex;gap:14px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:18px 6px;margin:0}
.idea:last-of-type{border-bottom:0}
.idea .body{font-size:16.5px;letter-spacing:-.01em}
.idea .star{color:var(--muted);background:none;flex:none}
.idea .star[aria-pressed="true"]{color:var(--fg)}
.idea .star[aria-pressed="true"] svg{fill:currentColor}
.idea .acts{opacity:0;transition:opacity .18s var(--ease)}
.idea:hover .acts,.idea:focus-within .acts{opacity:1}
@media (hover:none){.idea .acts{opacity:1}}
.tag{background:none;color:var(--muted);padding:0;margin-right:10px;font-weight:450;font-size:13px}

/* clips */
.clipform{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:26px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--lift);align-items:center;margin-bottom:16px}
.clipform label{font-size:0;gap:0;margin:0}
.clipform .in{font-size:15px;background:var(--flat);padding:12px 16px}
.clipform .btn.pri{padding:12px 24px}
.clips{gap:16px}
.clip{border-radius:22px;background:var(--glass);box-shadow:var(--lift)}
.cl-th{background:var(--flat2)!important;color:var(--muted)}
.cl-th span{font-weight:520}
.cl-b b{font-weight:560}
.cl-a .ico[aria-pressed="true"]{color:var(--fg)}

/* writing helper */
.ai{grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:28px}
.ai>.panel:first-child{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
.ai>.panel:first-child h2{display:none}
.ai-hl{gap:2px}
.plf{border-radius:14px;padding:12px 14px;font-weight:450;transition:background .18s var(--ease)}
.plf:hover{background:var(--flat)}
.plf[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.ai>.panel:last-child{padding:26px 28px}
.ai>.panel:last-child h2{font-size:22px;font-weight:540;letter-spacing:-.03em;margin-bottom:14px}
.ai .form{background:none;padding:0;gap:12px}
.ai textarea.in{min-height:110px!important;font-size:16px}
.ai-it,.ai-text{background:var(--flat);border-radius:18px}
.ai-off{background:none;padding:0;margin:0 0 18px}
.ai-nt{background:var(--flat)}

/* moodboard and whiteboard chrome */
.wbtools{border-radius:999px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--lift);padding:8px 14px}
.wbtools .grp{border-color:var(--line)}
.mood>*{border-radius:18px}

@media (max-width:860px){
  .notes,.ai{grid-template-columns:minmax(0,1fr)}
  #neditor>.panel{padding:20px}
  .ntitle{font-size:26px}
  .capture{padding-left:18px}
  .ai>.panel:first-child{overflow-x:auto}
  .ai-hl{flex-direction:row;gap:6px}
  .plf{white-space:nowrap;width:auto;background:var(--flat)}
}
@media (prefers-reduced-motion:reduce){.app,.side,.logo.pop{transition:none!important;animation:none!important}}

/* ===== whiteboard: full-bleed canvas, floating tools ===== */
.col-main[data-v="wb"] .hero{display:none}
.col-main[data-v="wb"] .wrap{max-width:none;padding:0 14px 14px}
.wbwrap{height:calc(100dvh - 118px);min-height:460px;border-radius:26px;border:1px solid var(--line);background:#F2F2F2;box-shadow:none}
.wbsvg{background:#F2F2F2}
.wbui{position:absolute;inset:0;z-index:6;pointer-events:none}
.wbui>*{pointer-events:auto}
.wbcard{background:var(--solid,#fff);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.10),0 1px 0 var(--edge) inset;display:flex;align-items:center;gap:2px;padding:6px}
.wbrail{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.wbrail>*{pointer-events:auto}
.wbmain,.wbhist{flex-direction:column}
.wbui .tb{width:44px;min-width:44px;height:44px;border-radius:13px;color:var(--fg);transition:background .15s var(--ease),color .15s,transform .15s var(--ease)}
.wbui .tb:hover{background:var(--flat)}
.wbui .tb:active{transform:scale(.94)}
.wbui .tb svg.i{width:21px;height:21px}
.wbui .tb[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.wbui .tbmore svg.i{width:16px;height:16px}
.wbui .tb[disabled]{opacity:.3}
.wbhist .tb{color:var(--muted)}
.wbfly{position:absolute;left:78px;top:50%;margin-top:-150px;flex-direction:column;animation:wbpop .18s var(--ease)}
.wbfly2{margin-top:-60px;align-items:stretch}
.wbfly .tb.wide{width:auto;padding:0 14px;justify-content:flex-start;display:flex;gap:8px;align-items:center;font-weight:500;white-space:nowrap}
.wbfly .sep{height:1px;background:var(--line);margin:4px 6px}
@keyframes wbpop{from{opacity:0;transform:translateX(-6px) scale(.97)}to{opacity:1;transform:none}}
.wbstyle{position:absolute;left:78px;top:14px;flex-direction:column;align-items:stretch;gap:8px;padding:10px;width:204px;animation:wbpop .18s var(--ease)}
.wbcols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.wbrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wbstyle .tb{width:auto;min-width:0;padding:0 14px;height:36px}
.wbstyle .wsel{flex:1;min-width:0;height:36px;background:var(--flat);border:0;border-radius:12px}

.wbempty[hidden]{display:none}
.wbempty-b{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:200px;padding:26px 18px 22px;border:1px solid var(--line);border-radius:30px;background:var(--flat);color:var(--fg);font:500 17px/1.25 var(--f-body);text-align:center;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.wbempty-b:hover{background:var(--flat2);transform:translateY(-2px)}

.wbempty-x{pointer-events:auto;position:absolute;right:-14px;top:-14px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--solid,#fff);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.wbempty-x svg.i{width:16px;height:16px}
.wbmini{left:86px;bottom:14px;width:150px;height:96px;border-radius:16px}
.wbtl{left:250px;right:150px;bottom:14px}

/* ===== motion ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.95)}}
@keyframes boxin{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes scrimin{from{opacity:0}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
@keyframes barin{from{transform:scaleX(0)}}
@keyframes appin{from{opacity:0;transform:scale(.992)}}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 30%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

.app{animation:appin .5s var(--ease) backwards}

/* views: children rise in one after another (only when you switch page) */
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.form,.capture,.hero,.chip,.sh-row){animation:rise .5s var(--ease) backwards}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(1){animation-delay:.02s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(2){animation-delay:.07s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(3){animation-delay:.12s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(4){animation-delay:.17s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(5){animation-delay:.22s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(6){animation-delay:.27s}
.wrap.enter :is(.stat,.ncard,.frame,.file,.card,.panel,.prow,.vz-tile,.sh-row):nth-child(7){animation-delay:.32s}

/* touch feedback */
.btn,.chip,.tb,.si-row,.tabbar button,.stat,.ncard,.file,.frame{-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.tabbar button:active{transform:scale(.94)}
.stat:active,.ncard:active,.file:active,.frame:active{transform:scale(.985)}

html,body{background:var(--bg)!important;color:var(--fg)}

/* ---- kill glass everywhere ---- */

/* ---- shell ---- */
.app{padding:0!important;gap:0!important;grid-template-columns:244px minmax(0,1fr)!important;background:var(--bg);animation:none!important}
.side{background:var(--side-bg)!important;border:0!important;border-right:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;padding:12px 10px 0!important;gap:2px!important}

.top{position:sticky;top:0;z-index:20;height:56px;padding:0 28px!important;gap:10px!important;border-bottom:1px solid var(--line)!important;background:color-mix(in srgb,var(--bg) 92%,transparent)!important;-webkit-backdrop-filter:blur(8px)!important;backdrop-filter:blur(8px)!important}

/* sidebar */

.si-row{border-radius:7px!important;padding:6px 10px!important;gap:10px!important;font:500 13.5px var(--f-body)!important;color:var(--muted)!important;min-height:32px;transform:none!important;box-shadow:none!important;background:none!important;border:0!important}

  --solid:#ffffff; --solid2:#f9f9f9; --glass:#ffffff; --glass2:#ffffff; --flat:#f3f3f2; --flat2:#ececea;
  --line:#eaeaea; --line2:#d9d9d6; --rule:#f3f3f3; --active:#ededec;
  --fg:#1f201d; --muted:#636361; --faint:#686866;
  --ink:#1f201d; --on-ink:#ffffff; --ink-bg:#1f201d;
  --accent:#1b6e66; --accent-fg:#ffffff; --accent-soft:#e7f1ef; --accent-line:#9fc8c2;
  --warn:#b42318; --warn-soft:#fdecea; --ok:#2e7d32; --ok-soft:#dcfae5; --danger:#b42318; --amber:#92400e; --amber-soft:#fffbeb;
  --st-i:#8c8c88; --st-m:#1f201d; --st-r:#a86b12; --st-s:#1b6e66;
  --c-home:#1b6e66; --c-notes:#c9c9c5; --c-ideas:#8c8c88; --c-board:#4b4b48; --c-mood:#1f201d; --c-lib:#1f201d; --c-wb:#1f201d; --c-viz:#1b6e66;
  --shadow:none; --lift:none; --pop:0 12px 32px -10px rgba(31,32,29,.22),0 0 0 1px var(--line);
  --r-card:22px; --r-inner:14px; --r-field:10px;
  --mc:var(--accent);
}

  color-scheme:dark;

  --warn:#f07a6a; --warn-soft:#2c1a18; --ok:#5cc58a; --ok-soft:#14281c; --danger:#f07a6a; --amber:#e8b25c; --amber-soft:#2a2112;
  --st-i:#8c8c88; --st-m:#e8e8e6; --st-r:#d29a3c; --st-s:#4fb3a7;

}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --side-bg:#000000; --surface:#111111; --surface2:#1a1a1a; --surface3:#222222; --card:#161616;
  --solid:#141414; --solid2:#1a1a1a; --glass:#111111; --glass2:#141414; --flat:#1a1a1a; --flat2:#222222;
  --line:#262626; --line2:#3a3a3a; --rule:#1a1a1a; --active:#222222;
  --fg:#f5f5f4; --muted:#b4b4b4; --faint:#a1a1a1;
  --ink:#f5f5f4; --on-ink:#000000; --ink-bg:#f5f5f4;
  --accent:#4fb3a7; --accent-fg:#001a17; --accent-soft:#10302c; --accent-line:#2f6e66;
  --warn:#f07a6a; --warn-soft:#2c1a18; --ok:#5cc58a; --ok-soft:#14281c; --danger:#f07a6a; --amber:#e8b25c; --amber-soft:#2a2112;
