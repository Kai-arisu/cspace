<!doctype html><html lang="en" class="authing"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E9E9EC"><title>Creator Space</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2317171A%27/%3E%3Cpath d=%27M21 11a7 7 0 1 0 0 10%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Navy sidebar on the left, top bar with search, one scrolling sheet per tool.
   Each tool owns a colour (--mc) that tints its header, buttons and icons. */
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface2:#ECEEF8; --fg:#161A33; --muted:#6A7094; --line:#E0E3F1;
  --side:#12163A; --side2:#1B2050; --side-fg:#C6CBF2; --side-mute:#8187BD;
  --c-home:#5B5BF0; --c-notes:#D97706; --c-ideas:#E0388A; --c-board:#0E9F6E; --c-mood:#9B51E0; --c-lib:#0284C7; --c-wb:#E5533D; --c-wb:#E5484D; --c-viz:#0F766E;
  --st-i:#8A90B8; --st-m:#5B5BF0; --st-r:#D97706; --st-s:#0E9F6E;
  --on-mc:#FFFFFF; --warn:#C2630A; --danger:#D43F3F; --ok:#0E9F6E;
  --shadow:0 1px 2px rgba(22,26,51,.06),0 10px 28px -14px rgba(22,26,51,.18);
  --f-display:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --mc:var(--c-home);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E24; --surface:#141937; --surface2:#1C2248; --fg:#ECEEFF; --muted:#9AA1D0; --line:#283060;
    --side:#070A1C; --side2:#10153A;
    --c-home:#7C7CFF; --c-notes:#F5A524; --c-ideas:#F06BAE; --c-board:#34D399; --c-mood:#B983F5; --c-lib:#38BDF8; --c-wb:#FF7A59; --c-wb:#FF7A7A; --c-viz:#2DD4BF;
    --st-i:#8F96C4; --st-m:#7C7CFF; --st-r:#F5A524; --st-s:#34D399;
    --on-mc:#0B0E24; --warn:#F5A524; --danger:#F27878; --ok:#34D399;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E24; --surface:#141937; --surface2:#1C2248; --fg:#ECEEFF; --muted:#9AA1D0; --line:#283060;
  --side:#070A1C; --side2:#10153A;
  --c-home:#7C7CFF; --c-notes:#F5A524; --c-ideas:#F06BAE; --c-board:#34D399; --c-mood:#B983F5; --c-lib:#38BDF8; --c-wb:#FF7A59; --c-wb:#FF7A7A; --c-viz:#2DD4BF;
  --st-i:#8F96C4; --st-m:#7C7CFF; --st-r:#F5A524; --st-s:#34D399;
  --on-mc:#0B0E24; --warn:#F5A524; --danger:#F27878; --ok:#34D399;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--mc)}
:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr)}
.col-main{display:flex;flex-direction:column;min-width:0;height:100%}
.col-main[data-v="home"]{--mc:var(--c-home)} .col-main[data-v="notes"]{--mc:var(--c-notes)}
.col-main[data-v="ideas"]{--mc:var(--c-ideas)} .col-main[data-v="board"]{--mc:var(--c-board)}
.col-main[data-v="mood"]{--mc:var(--c-mood)} .col-main[data-v="library"]{--mc:var(--c-lib)}
.col-main[data-v="wb"]{--mc:var(--c-wb)} .col-main[data-v="plan"]{--mc:var(--c-lib)}
.col-main[data-v="viz"]{--mc:var(--c-viz)}
.col-main[data-v="wb"] .wrap{max-width:none}

/* sidebar */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;height:100%;overflow:auto;
  padding:20px 14px 16px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--on-ink,#fff);background:var(--ink-bg,#17171A);flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;color:#fff;letter-spacing:-.01em}
.slbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);padding:0 8px;margin-bottom:6px}
.slist{display:flex;flex-direction:column;gap:2px}
.si-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:7px 8px;border-radius:10px;cursor:pointer;min-width:0}
.si-row:hover{background:var(--side2)}
.si-row[aria-current="true"]{background:var(--side2);color:#fff}
.si-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.si-row .ct{font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border-radius:999px;padding:0 8px;min-width:24px;text-align:center}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c)}
.si-row[aria-current="true"] .tile{background:var(--c);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin:0 10px 0 4px}
.si-row.soon{cursor:default;opacity:.62}
.si-row.soon:hover{background:none}
.si-row.soon .ct{font-size:10px;letter-spacing:.06em;background:transparent;border:1px solid rgba(255,255,255,.25)}
.sadd{margin:4px 0 0 8px}
.sbtn{background:transparent;border:1px dashed rgba(255,255,255,.28);color:var(--side-fg);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;width:calc(100% - 8px);text-align:left}
.sbtn:hover{border-color:#fff;color:#fff}
.sbtn[disabled]{opacity:.5;cursor:not-allowed}
.status{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-mute);padding:0 8px}
.status i{width:8px;height:8px;border-radius:50%;background:#34D399;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mbrand{display:none;align-items:center;gap:8px;min-width:0}
.spsel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:150px;font-weight:600}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.search input{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:9px 12px 9px 38px;min-width:0}
.search input:focus{border-color:var(--mc);background:var(--surface);outline:none}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:15;max-height:60vh;overflow:auto}
.sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover{background:var(--surface2)}
.sres .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);min-width:48px}
.sres .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .none{padding:10px;color:var(--muted);font-size:14px}
.topr{display:flex;align-items:center;gap:8px;margin-left:auto}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.qwrap{position:relative}
.qmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px;z-index:15}
.qmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.qmenu button:hover{background:var(--surface2)}

/* sheet */
.sheet{flex:1;min-height:0;overflow:auto;padding-block:24px 56px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:18px;border:1px solid var(--line);margin-bottom:22px;
  background:linear-gradient(115deg,color-mix(in srgb,var(--mc) 18%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.hero .tile{--c:var(--mc);width:52px;height:52px;border-radius:15px;background:var(--mc);color:var(--on-mc)}
.hero .tile svg.i{width:26px;height:26px}
.hero .txt{flex:1;min-width:180px}
.hero h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--mc);color:var(--mc)}
.btn.pri{background:var(--mc);border-color:var(--mc);color:var(--on-mc)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-mc)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;line-height:1;display:inline-flex}
.ico:hover{color:var(--fg);background:var(--surface2)}
.ico.danger{color:var(--danger)}
.ico[disabled]{opacity:.35;cursor:not-allowed}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{border-color:var(--mc);outline:none}
textarea.in{resize:vertical;min-height:90px}
.ghost{background:transparent;border:0;padding:0;width:100%;min-width:0}
.ghost:focus{outline:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.item:first-of-type{border-top:0}
.item .t{overflow-wrap:anywhere;min-width:0}

.top-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.ringcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring text{font-family:var(--f-display);font-weight:800;font-size:28px;fill:var(--fg)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sq{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:16px;width:100%}
.seg i{display:block;height:100%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--c)}
.stat .tile{width:34px;height:34px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

.notes{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.nlist{display:flex;flex-direction:column;gap:8px;max-height:64vh;overflow:auto}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0;box-shadow:var(--shadow)}
.ncard[aria-current="true"]{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 30%,transparent)}
.ncard b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncard span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntitle{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.01em}
.nbody{min-height:44vh;border:0;background:transparent;padding:0;resize:vertical;width:100%;line-height:1.7;font-size:16px;max-width:68ch}
.nbody:focus{outline:none}
.nmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}

.capture{display:flex;gap:10px;margin-bottom:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.capture .in{border:0;background:var(--surface2);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mc);color:var(--on-mc);border-color:var(--mc)}
.tag{font-size:12px;font-weight:600;color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,transparent);border-radius:6px;padding:1px 7px;margin-right:6px}
.idea{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.idea .body{flex:1;min-width:0;overflow-wrap:anywhere}
.idea .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.star{color:var(--muted)}
.star svg{fill:none}
.star[aria-pressed="true"]{color:var(--c-notes)}
.star[aria-pressed="true"] svg{fill:currentColor}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:color-mix(in srgb,var(--sc) 7%,var(--surface2));border-radius:16px;padding:10px;min-height:180px;min-width:0;border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--sc);outline-offset:-2px}
.col h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
.col h3 .cn{font-size:12px;font-weight:700;background:var(--surface);border-radius:999px;padding:0 8px;color:var(--sc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.card.late{border-color:var(--warn)}
.card .ct{font-weight:600;overflow-wrap:anywhere}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.card input[type=date]{background:transparent;border:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0;max-width:128px}
.card.late input[type=date]{color:var(--warn)}
.addtask .in{padding:7px 10px;font-size:14px;background:var(--surface)}

.mood{columns:220px;column-gap:14px}
.frame{break-inside:avoid;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.frame .tagno{position:absolute;top:8px;left:8px;z-index:1;font-family:var(--f-mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.frame .x{position:absolute;top:6px;right:6px;z-index:1;background:var(--surface);border:1px solid var(--line);padding:3px}
.frame img{display:block;width:100%;height:auto}
.frame .sw{height:130px}
.frame .meta{padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.frame .meta .mono{font-size:12px;color:var(--muted)}
.frame .notebox{padding:38px 14px 14px;background:color-mix(in srgb,var(--mc) 10%,var(--surface));white-space:pre-wrap;overflow-wrap:anywhere}
.frame .linkbox{padding:34px 12px 4px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.form > label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0}
.form > label.fix{flex:0 0 auto}
.form input[type=color]{width:56px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pal{display:flex;gap:12px;flex-wrap:wrap}
.pal button{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;width:112px;padding:0;text-align:left;box-shadow:var(--shadow)}
.pal .sw{height:72px}
.pal .hx{font-family:var(--f-mono);font-size:12px;padding:7px 9px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.file .thumb{height:110px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file .meta{padding:8px 12px;font-size:13px;overflow-wrap:anywhere}
.file .foot{display:flex;justify-content:space-between;padding:0 8px 8px 12px;align-items:center}
.sec{margin-top:28px}
.sec > h2{font-size:16px;font-weight:700;margin-bottom:12px}
.note-hint{font-size:13px;color:var(--muted);margin:0 0 12px}

.wbtools{display:flex;gap:6px 4px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.wbtools .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding-right:10px;margin-right:6px;border-right:1px solid var(--line)}
.wbtools .grp:last-child{border-right:0;margin-right:0;padding-right:0}
.tb{min-width:38px;height:38px;padding:0 8px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;display:inline-grid;place-items:center;color:var(--fg);font-size:13px;font-weight:600}
.tb:hover{background:var(--surface2)}
.tb[aria-pressed="true"]{background:var(--mc);color:var(--on-mc)}
.tb[disabled]{opacity:.35;cursor:not-allowed}
.cs{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c);padding:0}
.cs[aria-pressed="true"]{box-shadow:0 0 0 2px var(--mc)}
.wsel{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.wbz{font-size:13px;font-weight:600;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.wbwrap{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);height:clamp(420px,66vh,760px);background:#FBFBFE}

/* polish + v6 */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 40%,transparent) transparent}
:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
.hero{position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 32%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.wrap.enter{animation:vin .35s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.stat,.ncard,.frame,.file,.card{transition:transform .15s,box-shadow .15s,border-color .15s}
.stat:hover,.ncard:hover,.frame:hover,.file:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px color-mix(in srgb,var(--c,var(--mc)) 45%,transparent)}
.card:hover{border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.si-row[aria-current="true"]{box-shadow:inset 3px 0 0 var(--c)}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}

.kcmd{padding:6px 10px}
.card{--pc:transparent;box-shadow:inset 4px 0 0 var(--pc),var(--shadow)}
.card[data-pri="1"]{--pc:var(--c-lib)} .card[data-pri="2"]{--pc:var(--warn)} .card[data-pri="3"]{--pc:var(--danger)}
.pflag{opacity:.4} .pflag[data-p="1"]{color:var(--c-lib);opacity:1} .pflag[data-p="2"]{color:var(--warn);opacity:1} .pflag[data-p="3"]{color:var(--danger);opacity:1}
.ftimer{display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 4px}
.ftimer[data-run="true"]{border-color:var(--c-wb);background:color-mix(in srgb,var(--c-wb) 12%,var(--surface2))}
.ftimer[data-mode="b"][data-run="true"]{border-color:var(--c-board);background:color-mix(in srgb,var(--c-board) 12%,var(--surface2))}

.ftm:hover{color:var(--fg)}
.ftimer .ico{padding:4px}
.cmdk{position:fixed;inset:0;z-index:40;background:rgba(8,10,28,.55);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.palbox{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}

.palit .tile{--c:inherit;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none}

.palit span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Studio theme: frosted glass, black and white, colour kept for data ===== */
:root{
  --bg:#E9E9EC; --surface:rgba(255,255,255,.74); --surface2:rgba(16,16,22,.055); --fg:#0B0B0C; --muted:#6C6C74; --line:rgba(16,16,22,.09);
  --side:transparent; --side2:rgba(16,16,22,.06); --side-fg:#2C2C31; --side-mute:#8A8A92;
  --ink:#0B0B0C; --on-ink:#FFFFFF; --ink-bg:#0B0B0C;
  --shadow:0 1px 1px rgba(16,16,22,.04),0 18px 40px -22px rgba(16,16,22,.28);
  --c-home:#4F46E5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08080A; --surface:rgba(30,30,34,.66); --surface2:rgba(255,255,255,.075); --fg:#F4F4F5; --muted:#9C9CA5; --line:rgba(255,255,255,.1);
    --side:transparent; --side2:rgba(255,255,255,.08); --side-fg:#DCDCE0; --side-mute:#8C8C95;
    --ink:#F4F4F5; --on-ink:#0B0B0C; --ink-bg:#000000;
    --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.8);
    --c-home:#8B8BFF;
  }
}
:root[data-theme="dark"]{
  --bg:#08080A; --surface:rgba(30,30,34,.66); --surface2:rgba(255,255,255,.075); --fg:#F4F4F5; --muted:#9C9CA5; --line:rgba(255,255,255,.1);
  --side:transparent; --side2:rgba(255,255,255,.08); --side-fg:#DCDCE0; --side-mute:#8C8C95;
  --ink:#F4F4F5; --on-ink:#0B0B0C; --ink-bg:#000000;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.8);
  --c-home:#8B8BFF;
}
body{background:radial-gradient(1100px 650px at 12% -8%,color-mix(in srgb,var(--fg) 6%,transparent),transparent 70%),radial-gradient(900px 600px at 100% 105%,color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%),var(--bg)}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1}
body:before{left:-70px;bottom:-90px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff,#d9d9de 55%,#aeaeb6);box-shadow:0 40px 80px -30px rgba(0,0,0,.35)}
body:after{right:-90px;top:-70px;width:340px;height:340px;border-radius:50%;border:56px solid #f5f5f7;
  box-shadow:inset 0 0 40px rgba(0,0,0,.14),inset 0 6px 14px rgba(255,255,255,.9),0 40px 70px -30px rgba(0,0,0,.3)}
:root[data-theme="dark"] body:before{background:radial-gradient(circle at 34% 28%,#4a4a52,#242428 60%,#101013)}
:root[data-theme="dark"] body:after{border-color:#26262b;box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 6px 14px rgba(255,255,255,.12),0 40px 70px -30px #000}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body:before{background:radial-gradient(circle at 34% 28%,#4a4a52,#242428 60%,#101013)}
  :root:not([data-theme="light"]) body:after{border-color:#26262b;box-shadow:inset 0 0 40px rgba(0,0,0,.6),inset 0 6px 14px rgba(255,255,255,.12),0 40px 70px -30px #000}
}

/* floating shell */
.app{padding:14px;gap:14px;grid-template-columns:262px minmax(0,1fr)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);padding:20px 12px 16px 12px}
.col-main{border-radius:30px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 62%,transparent);box-shadow:var(--shadow);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);overflow:hidden}
.logo{background:var(--ink);color:var(--on-ink)}
.brand b{color:var(--fg)}
.slbl{color:var(--side-mute)}
.si-row{border-radius:999px;padding:7px 10px}
.si-row:hover{background:var(--side2)}
.si-row .tile{background:transparent;color:var(--c);width:26px;height:26px}
.si-row[aria-current="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.si-row[aria-current="true"] .tile{background:transparent;color:var(--on-ink)}
.si-row .ct{background:var(--surface2);color:inherit}
.si-row[aria-current="true"] .ct{background:color-mix(in srgb,var(--on-ink) 20%,transparent)}
.si-row.soon .ct{border-color:var(--line)}
.sbtn{border:1px dashed var(--line);color:var(--side-fg);border-radius:999px}
.sbtn:hover{border-color:var(--fg);color:var(--fg)}
.status{color:var(--side-mute)}

/* top bar */
.top{border-bottom:0;background:transparent;padding-block:18px 6px}
.search input{border-radius:999px;background:var(--surface);border:1px solid var(--line);padding:11px 16px 11px 42px;backdrop-filter:blur(12px)}
.search input:focus{border-color:var(--fg);background:var(--surface)}
.date{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;color:var(--fg)}
.topr .ico{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);align-items:center;justify-content:center}
#themebtn{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kcmd{padding:7px 12px}
.ftimer{background:var(--surface);padding:4px 6px}
.ftimer .ico{width:28px!important;height:28px!important;border:0!important;background:none!important}
.sres,.qmenu{border-radius:20px;backdrop-filter:blur(24px);background:color-mix(in srgb,var(--surface) 92%,var(--bg))}

/* buttons */
.btn{border-radius:999px;background:var(--surface);padding:8px 16px}
.btn:hover{border-color:var(--fg);color:var(--fg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:none;opacity:.88;color:var(--on-ink)}
.btn.sm{padding:4px 12px}
.chip{background:var(--surface);padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.in{border-radius:14px;background:var(--surface)}
.in:focus{border-color:var(--fg)}

/* heading instead of hero card */
.hero,.col-main[data-v] .hero{background:none;border:0;box-shadow:none;padding:6px 0 10px;overflow:visible;margin-bottom:16px;gap:14px}
.hero:after{display:none}
.hero .tile,.col-main[data-v] .hero .tile{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);flex:none}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1}
.hero p{font-size:15px;margin-top:8px}

/* glass cards */
.panel,.stat,.ncard,.frame,.file,.vz-tile,.form,.capture,.wbtools,.dlgbox{border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel{padding:22px}
.panel h2{font-size:17px}
.stat:hover,.ncard:hover,.frame:hover,.file:hover{border-color:var(--line)}
.col{border-top:0;border-radius:26px;background:var(--surface2)}
.col h3>span:first-child:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc);margin-right:8px}
.card{border-radius:18px}
.ncard,.idea{border-radius:18px}
.vz-tile{border-radius:24px}
.wbwrap{border-radius:26px}
.ncard[aria-current="true"]{border-color:var(--fg);box-shadow:none}

/* black feature cards */
.panel.ink{background:var(--ink-bg);color:#F4F4F5;border-color:var(--ink-bg);--fg:#F4F4F5;--muted:#A3A3AC;--line:rgba(255,255,255,.14);--surface:rgba(255,255,255,.08);--surface2:rgba(255,255,255,.1);backdrop-filter:none}
.panel.ink .btn{color:#F4F4F5;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}

.search .si{color:var(--fg);opacity:.6}
/* tabbar + mobile */
@media (max-width:860px){
  .app{padding:0;gap:0;grid-template-columns:minmax(0,1fr)}
  .col-main{border-radius:0;border:0;box-shadow:none}
  body:before,body:after{display:none}
  .top{padding-block:12px 4px}
  .tabbar{background:color-mix(in srgb,var(--surface) 88%,var(--bg));backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .tabbar button{border-radius:999px}
  .tabbar button[aria-current="true"]{background:var(--ink);color:var(--on-ink)}
  .hero h1{font-size:clamp(30px,9vw,40px)}
}
/* ===== moodboard v2 ===== */
.mb{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:clamp(18px,3.4vw,44px);box-shadow:var(--shadow);backdrop-filter:blur(14px);font-family:var(--fb)}
.mb-head{text-align:center;padding-bottom:26px}
.mb-kick{font-size:12px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.mb-title{font-family:var(--fh);font-weight:var(--fhw);font-size:clamp(40px,8vw,92px);line-height:1;letter-spacing:-.02em;margin:14px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.mb-tag{font-size:clamp(12px,1.6vw,16px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.mb-about{max-width:62ch;margin:16px auto 0;color:var(--muted)}
.mb-kw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;align-items:center}
.mb-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--surface2)}
.mb-chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 2px;font-size:16px;line-height:1}
.mb-kwin{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:13px;min-width:170px}
.mb-kwin:focus{outline:none;border-color:var(--fg)}
.mb-form{background:var(--surface2);border-radius:20px;padding:14px;margin:0 0 16px;align-items:flex-end}
.mb-empty{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:1px dashed var(--line);border-radius:22px;padding:22px;margin-bottom:10px}
.mb-empty span{color:var(--muted);max-width:50ch;font-size:14px}
.mb-sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding:26px 0}
.mb-lbl h3{font-family:var(--fh);font-weight:var(--fhw);font-size:22px;letter-spacing:-.01em}
.mb-lbl p{margin:4px 0 12px;font-size:13px;color:var(--muted)}
.mb-add{display:flex;flex-wrap:wrap;gap:6px}
.mb-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.mb-none{color:var(--muted);font-size:14px;padding:10px 0}
.mb-it{position:relative;margin:0;min-width:0}
.mb-ctl{position:absolute;top:6px;right:6px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;opacity:0;transition:opacity .15s;z-index:2}
.mb-ctl .ico{padding:4px;width:26px;height:26px;justify-content:center;border-radius:50%}
.mb-ctl svg.i{width:14px;height:14px}
.mb-it:hover .mb-ctl,.mb-it:focus-within .mb-ctl{opacity:1}
@media (hover:none){.mb-ctl{opacity:1}}
.mb-it figcaption{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.k-color{flex:1 1 88px;max-width:150px}
.mb-sw{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:100%;height:150px;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;cursor:pointer}
.mb-sw .hex{font:600 12px var(--f-mono);letter-spacing:.04em}
.mb-sw .nm{font-size:12px;opacity:.85}
.mb-sw:hover{transform:translateY(-3px)}
.k-image,.k-pattern{width:clamp(130px,22%,210px);flex:0 0 auto}
.mb-img{border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--surface2);border:1px solid var(--line)}
.mb-img img{display:block;width:100%;height:100%;object-fit:cover}
.s-logo .mb-img{aspect-ratio:1;background:#fff}.s-logo .mb-img img{object-fit:contain;padding:10px}
.mb-pat{border-radius:18px;aspect-ratio:1;border:1px solid var(--line)}
.k-quote{flex:1 1 280px;max-width:480px}
.mb-quote{margin:0;background:var(--ink-bg);color:#F4F4F5;border-radius:22px;padding:22px 24px;position:relative}
.mb-quote .qm{font-family:var(--fh);font-size:56px;line-height:.6;opacity:.5;display:block;height:22px}
.mb-quote p{margin:0;font-family:var(--fh);font-size:clamp(18px,2.2vw,24px);line-height:1.3}
.mb-quote cite{display:block;margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-style:normal}
.k-note{flex:1 1 220px;max-width:340px}
.mb-note{background:color-mix(in srgb,var(--c-notes) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c-notes) 25%,var(--line));border-radius:6px 18px 18px 18px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.k-icon{flex:0 0 auto}
.mb-ico{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
.mb-ico span{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center}
.mb-ico svg.i{width:28px;height:28px;stroke-width:1.5}
.mb-ico small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.k-link{flex:1 1 220px;max-width:320px}
.mb-link{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--fg);background:var(--surface2)}
.mb-link small{color:var(--muted);font-family:var(--f-mono)}
.mb-type{display:grid;grid-template-columns:150px 150px minmax(0,1fr);gap:14px;align-items:stretch}
.mb-tc{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;background:var(--surface2)}
.mb-tc .aa{font-size:56px;line-height:1.05}
.mb-tc small{color:var(--muted);font-size:12px}
.mb-ts{border:1px solid var(--line);border-radius:20px;padding:18px}
.mb-ts .h{font-size:clamp(22px,3vw,34px);line-height:1.15}
.mb-ts p{margin:10px 0 0;color:var(--muted);font-size:14px}
/* collage */
.mb-addrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.mb-collage{columns:230px;column-gap:18px;padding:10px 6px}
.mb-collage .mb-it{break-inside:avoid;margin:0 0 22px;transform:rotate(var(--r));transition:transform .2s;width:100%;max-width:none;flex:none}
.mb-collage .mb-it:hover{transform:rotate(0) scale(1.02);z-index:3}
.mb-collage .k-image{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45);color:#222}
.mb-collage .k-image .mb-img{border-radius:2px;aspect-ratio:auto;border:0}
.mb-collage .k-image figcaption{font-family:var(--fh);font-style:italic;font-size:14px;color:#444;text-align:center;margin-top:8px}
.mb-collage .k-image:before,.mb-collage .k-note:before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(214,196,160,.6);z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mb-collage .k-note{background:none}
.mb-collage .mb-note{border-radius:4px;box-shadow:0 12px 24px -14px rgba(0,0,0,.4);padding:22px 16px 16px}
.mb-collage .k-color{max-width:none}
.mb-collage .mb-sw{height:110px}
.mb-collage .mb-pat{box-shadow:0 12px 24px -14px rgba(0,0,0,.4)}
.mb-collage .k-icon{display:flex;justify-content:center}
.mb-collage .k-type .mb-type{grid-template-columns:1fr 1fr}.mb-collage .k-type .mb-ts{grid-column:1/-1}
.mb-collage .k-type{background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:14px}
@media (max-width:860px){
  .mb-sec{grid-template-columns:minmax(0,1fr);gap:14px}
  .mb-type{grid-template-columns:1fr 1fr}.mb-ts{grid-column:1/-1}
  .k-image,.k-pattern{width:calc(50% - 6px)}
}
/* ===== planner + notes sections ===== */

.clk{width:116px;height:116px;flex:none}

@media (max-width:1000px){.plan{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.pst{display:none}.clkcard{flex-direction:column;align-items:flex-start}}

/* merge two values after a conflict: keep both sides' additions */

    var obj=function(a){return a.every(function(x){return x&&typeof x==="object"&&!Array.isArray(x)&&x.id})};
    if(obj(l)&&obj(r)){
      var lm={};l.forEach(function(x){lm[x.id]=x});var seen={},out=[];
      r.forEach(function(x){seen[x.id]=1;var y=lm[x.id];out.push(y&&(y.ts||0)>=(x.ts||0)?y:x)});

/* apply a remote snapshot (values by key, hashes by key) onto local state */
function syApply(vals,hs){
  var loc=shards(syncPart(S)),changed=false,conflict=false,fresh=!SY.localTs;
  var needSnap=Object.keys(hs).some(function(k){return loc[k]&&loc[k].h!==hs[k]&&!fresh});
  if(needSnap)snapLocal("Before sync",true);
  Object.keys(hs).forEach(function(k){
    if(loc[k]&&loc[k].h===hs[k])return;
    var rv=vals[k];if(rv===undefined)return;
    var bh=SY.base[k],lh=loc[k]&&loc[k].h;
    var remoteChanged=hs[k]!==bh,localChanged=!!lh&&lh!==bh;
    if(fresh||!localChanged){S[k]=rv;changed=true}
    else if(!remoteChanged){SY.pending=true}
    else{S[k]=mergeVal(S[k],rv);changed=true;SY.pending=true;conflict=true}
  });
  Object.keys(hs).forEach(function(k){SY.base[k]=hs[k]});
  if(changed){fix();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function syRender(){clearTimeout(SY.renderT);if(syBusyUi()){SY.renderT=setTimeout(syRender,2500);return}render()}
function syBusyUi(){var a=document.activeElement;return WB.drag||WB.edit||(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.id!=="nsearch"&&a.id!=="dimp")}

async function syFetchKeys(meta,loc){
  var vals={},hs={};
  var keys=Object.keys(meta.keys||{});
  for(var q=0;q<keys.length;q++){
    var k=keys[q],mk=meta.keys[k];hs[k]=mk.h;
    if(loc[k]&&loc[k].h===mk.h){vals[k]=undefined;continue}
    var s="";
    for(var i=0;i<mk.n;i++){
      var d=await db.doc("store/k_"+k+"_"+i).get();
      if(!d.exists||!d.data()||typeof d.data().s!=="string")throw {code:"partial"};
      s+=d.data().s;

async function syPull(meta){

async function syOnMeta(snap){
  if(!db)return;

  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  var m=snap.exists?snap.data():null;
  if(m&&m.dev===TAB&&SY.meta&&m.ts===SY.meta.ts){SY.ready=true;return}
  if(m&&syBusyUi()){clearTimeout(SY.deferT);SY.deferT=setTimeout(function(){syOnMeta(snap)},2500);return}
  SY.pulling=true;
  try{
    if(m){await syPull(m)}
    else{
      if(!SY.legacyChecked){
        SY.legacyChecked=true;
        var lg=await db.doc("app/main").get();
        if(lg.exists&&lg.data()&&lg.data().state&&typeof lg.data().state==="object"){
          var st=syncPart(lg.data().state),sh=shards(st),vals={},hs={};
          Object.keys(sh).forEach(function(k){vals[k]=st[k];hs[k]=sh[k].h});
          var res=syApply(vals,hs);if(res.changed)syRender();

async function syFlush(force){
  if(!db||readOnly||!SY.ready){syStatus();return}
  if(SY.busy||SY.pulling){SY.again=true;return}
  SY.busy=true;SY.again=false;clearTimeout(SY.rtimer);
  var stamp=SY.localTs;
  syStatus();
  try{
    var lease=async function(){
      var d=db.doc("store/lock");if(!d||typeof d.acquire!=="function")return true;
      var r=await d.acquire({holder:TAB,ttlMs:6000});return !!(r&&r.acquired);
    };
    if(!(await lease())){
      SY.busy=false;clearTimeout(timer);timer=setTimeout(function(){syFlush(force)},1200+Math.random()*1200);syStatus();return;
    }
    var cur=await db.doc("store/meta").get();
    if(cur.exists&&cur.data()&&(!SY.meta||cur.data().ts!==SY.meta.ts)&&cur.data().dev!==TAB)await syPull(cur.data());
    var sh=shards(syncPart(S)),remote=(SY.meta&&SY.meta.keys)||{},keys={};
    for(var k in sh){
      keys[k]={n:sh[k].p.length,h:sh[k].h};
      if(!force&&remote[k]&&remote[k].h===sh[k].h)continue;
      await lease();
      for(var i=0;i<sh[k].p.length;i++)await db.doc("store/k_"+k+"_"+i).set({s:sh[k].p[i],i:i});
    }
    var ts=Math.max(Date.now(),((SY.meta&&SY.meta.ts)||0)+1),meta={ts:ts,dev:TAB,keys:keys,v:2};
    await db.doc("store/meta").set(meta);
    SY.meta=meta;
    for(var k2 in remote){
      var nn=keys[k2]?keys[k2].n:0;
      for(var j=nn;j<remote[k2].n;j++)await db.doc("store/k_"+k2+"_"+j).delete();
    }

    if(SY.localTs===stamp)SY.pending=false;else SY.again=true;

  }catch(e){SY.busy=false;syFail(e,"push");return}

  if(SY.queued){var q=SY.queued;SY.queued=null;syOnMeta(q)}
  if(SY.again||SY.pending){SY.again=false;clearTimeout(timer);timer=setTimeout(function(){syFlush()},400)}

function flush(){return syFlush()}

function syFail(e,where){

  var code=(e&&e.code)||"unavailable";SY.code=code;SY.err=(e&&e.message)||code;
  if(code==="invalid_argument"&&where==="push"){readOnly=true;SY.err="";setStatus("View only: you can't save here");render();return}
  if(code==="quota_exceeded"){SY.full=true;syStatus();return}
  if(code==="revoked"||code==="not_granted"||code==="capability_disabled"||code==="capability_removed"){db=null;syStatus();return}
  var d=code==="partial"?1500:Math.min(60000,2000*Math.pow(2,SY.retry));SY.retry++;

function snapLocal(label,force,json){

    var now=Date.now();if(!force&&now-SY.lastSnap<10*60*1000)return;

function oops(){var n=Date.now();if(n-errAt<10000)return;errAt=n;toast("Something went wrong. Your data is safe.")}
window.addEventListener("error",function(e){if(e&&e.target&&e.target!==window)return;oops()});
window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;if(r&&(r.code==="declined"||r.name==="AbortError"))return;oops()});
function renderFail(e){
  try{console.error(e)}catch(x){}
  var w=$("wrap");if(!w)return;
  w.innerHTML='<div class="panel rerr"><h2>This view hit a problem</h2><p>Your data is safe. You can try again, go back to Overview, or restore a backup.</p><div class="drow"><button class="btn pri" data-act="rerr_retry">Try again</button><button class="btn" data-act="rerr_home">Go to Overview</button><button class="btn" data-act="datadlg">Data and backup</button></div></div>';
}

/* ---------- theme ---------- */
function isDark(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t)return t==="dark";
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintTheme(){$("themebtn").innerHTML=I(isDark()?"sun":"moon")}
function toggleTheme(){
  var t=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem(LS+"-theme",t)}catch(e){}
  paintTheme();
}

  var k=t.dataset.vk,v=t.type==="checkbox"?t.checked:(t.type==="range"||t.type==="number"?+t.value:t.value);
  if(t.dataset.n)v=+v;
  if(k.indexOf("C.")===0){var c=veSel();if(!c)return;c[k.slice(2)]=v;if(k==="C.s"||k==="C.e"){if(c.e<c.s+.1)c.e=r1(c.s+.1);veTlBuild()}if(k==="C.text")veTlBuild()}
  else if(k.indexOf("f.")===0)VE.f[k.slice(2)]=v;
  else if(k==="speed"){VE.speed=v;if(VE.video)VE.video.playbackRate=v;veTlUpd()}
  else if(k==="vol"){VE.vol=v;veApplyAudio()}
  else if(k==="mute"){VE.mute=v;veApplyAudio()}
  var o=t.parentNode&&t.parentNode.querySelector(".edv");if(o)o.textContent=(Math.round(v*100)/100)+(t.dataset.u||"");
  veSave();veDraw();
});
document.addEventListener("keydown",function(e){
  if(S.view!=="ve"||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName)||!VE.ready)return;
  if(e.key===" "){e.preventDefault();if(VE.video.paused)vePlay();else veStop()}
  else if(e.key==="ArrowLeft"){e.preventDefault();veStop();veSeek(VE.video.currentTime-(e.shiftKey?1:.1))}
  else if(e.key==="ArrowRight"){e.preventDefault();veStop();veSeek(VE.video.currentTime+(e.shiftKey?1:.1))}
  else if(e.key==="i"||e.key==="I"){veAct("ve_in",{dataset:{}})}
  else if(e.key==="o"||e.key==="O"){veAct("ve_out",{dataset:{}})}
});


/* ---------- reminders and shortcuts ---------- */
function bellItems(){
  var today=ymd(new Date()),tm=ymd(new Date(Date.now()+86400000)),out=[];
  mine("tasks").forEach(function(t){if(t.col==="s"||!t.due)return;if(t.due<today)out.push({k:0,l:t.title,s:"Overdue · "+fmtDue(t.due),v:"board"});else if(t.due===today)out.push({k:1,l:t.title,s:"Due today",v:"board"});else if(t.due===tm)out.push({k:2,l:t.title,s:"Due tomorrow",v:"board"})});
  mine("posts").forEach(function(p){if(p.status==="published"||!p.date)return;if(p.date<today)out.push({k:0,l:p.title,s:"Post overdue · "+fmtDue(p.date),v:"cal"});else if(p.date===today)out.push({k:1,l:p.title,s:"Post goes out today",v:"cal"});else if(p.date===tm)out.push({k:2,l:p.title,s:"Post tomorrow",v:"cal"})});
  mine("invoices").forEach(function(v){if(v.paid||!v.due)return;if(v.due<today)out.push({k:0,l:(v.no||"Invoice")+" · "+(v.client||""),s:"Invoice overdue · "+fmtDue(v.due),v:"biz"})});
  return out.sort(function(a,b){return a.k-b.k});
}
function paintBell(){
  var b=$("bellbtn");if(!b)return;var n=bellItems().length;
  b.innerHTML=I("bell")+(n?'<span class="bdg">'+(n>9?"9+":n)+'</span>':"");
}
function bellToggle(){
  var m=$("bellm");if(!m)return;var open=m.hidden;closeMenus();if(!open)return;

}

var gPend=0;
document.addEventListener("keydown",function(e){
  var t=e.target;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="?"){e.preventDefault();showShortcuts();return}
  if(gPend&&Date.now()-gPend<1200){
    var map={h:"home",n:"notes",i:"ideas",m:"mood",w:"wb",v:"ve",p:"plan",b:"board",c:"cal",l:"library"},v=map[e.key.toLowerCase()];gPend=0;
    if(v){e.preventDefault();go(v)}return;
  }
  if(e.key==="g"||e.key==="G"){gPend=Date.now()}
});
/* paste or drop images into the moodboard and library */
function addPicture(file){
  if(!file||!/^image\//.test(file.type)||readOnly)return;
  if(!assets){toast("Image upload isn't available here.");return}
  toast("Uploading…");
  assets.upload(file).then(function(r){
    var nm=file.name||"Pasted image";
    S.files.push({id:uid(),sp:S.cur,name:nm,assetId:r.id,type:r.contentType,size:r.sizeBytes});
    if(S.view==="mood")S.mood.push({id:uid(),sp:S.cur,kind:"image",assetId:r.id,label:"",value:""});
    touch();render();toast("Added");
  }).catch(function(x){toast(upErr(x))});
}
document.addEventListener("paste",function(e){
  if((S.view!=="mood"&&S.view!=="library")||/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName))return;
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(var i=0;i<items.length;i++){if(items[i].type.indexOf("image/")===0){var f=items[i].getAsFile();if(f){e.preventDefault();addPicture(f)}break}}
});
document.addEventListener("dragover",function(e){if((S.view==="mood"||S.view==="library")&&e.dataTransfer&&e.dataTransfer.types&&[].indexOf.call(e.dataTransfer.types,"Files")>-1)e.preventDefault()});
document.addEventListener("drop",function(e){
  if(S.view!=="mood"&&S.view!=="library")return;var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f&&/^image\//.test(f.type)){e.preventDefault();addPicture(f)}
});

/* ---------- overview bento ---------- */
function bnSeries(){
  var days=[],i;for(i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  var chg=days.map(function(){return 0}),shp=chg.slice();
  function add(arr,ts){if(!ts)return;var k=days.indexOf(ymd(new Date(ts)));if(k>-1)arr[k]++}
  ["notes","ideas","tasks"].forEach(function(k){mine(k).forEach(function(x){add(chg,x.ts)})});
  mine("tasks").forEach(function(x){if(x.col==="s")add(shp,x.done||x.ts)});
  return {chg:chg,shp:shp};
}
function bnLine(vals,w,h,mx){
  if(vals.length<2)return"";
  var pts=vals.map(function(v,i){return [w*i/(vals.length-1),h-4-(h-8)*(v/(mx||1))]});
  var d="M"+r1(pts[0][0])+" "+r1(pts[0][1]);
  for(var i=1;i<pts.length;i++){var m=(pts[i-1][0]+pts[i][0])/2;d+="C"+r1(m)+" "+r1(pts[i-1][1])+" "+r1(m)+" "+r1(pts[i][1])+" "+r1(pts[i][0])+" "+r1(pts[i][1])}
  return d;
}
function bnSchedule(t,fmin){
  var today=ymd(new Date()),rows="",any=false,posts=mine("posts").filter(function(p){return p.status!=="published"&&p.date});
  for(var i=0;i<6;i++){
    var d=new Date();d.setDate(d.getDate()+i);var key=ymd(d),items=[];
    t.forEach(function(x){if(x.col!=="s"&&x.due&&(x.due===key||(i===0&&x.due<today)))items.push({k:"task",title:x.title,late:x.due<today,view:"board"})});
    posts.forEach(function(p){if(p.date===key)items.push({k:"post",title:p.title,late:false,view:"cal"})});
    if(items.length)any=true;
    rows+='<div class="bn-day"><span class="bn-dl">'+(i===0?"Today":d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric"}))+'</span><div class="bn-track">'+
      items.slice(0,3).map(function(it,j){return '<button class="bn-pill'+(it.k==="post"?" post":"")+'" style="margin-left:'+(j===0?i*3:6)+'%" data-act="view" data-id="'+it.view+'" title="'+esc(it.title)+'">'+(it.late?'<i class="bn-late"></i>':"")+esc(it.title)+'</button>'}).join("")+
      (items.length>3?'<span class="muted" style="font-size:12px;margin-left:8px">+'+(items.length-3)+'</span>':"")+'</div></div>';
  }
  return '<section class="panel bn-sch"><h2>This week<span class="bn-chip">'+I("timer")+fmin+' min focused today</span></h2>'+
    (any?'<div class="bn-days">'+rows+'</div>':'<div class="bn-days">'+rows+'</div><div class="empty" style="margin-top:8px">Nothing scheduled yet. Give a task a due date or schedule a post.</div>')+
    '<div class="bn-leg"><span><i class="k"></i>Task</span><span><i class="k post"></i>Post</span><span><i class="k late"></i>Overdue</span></div></section>';
}
function bnProgress(t,pct,r){
  var s=bnSeries(),mx=Math.max.apply(null,s.chg.concat(s.shp).concat([1])),total=t.length,rv=total?Math.round(r/total*100):0;
  var ideas=mine("ideas"),conv=ideas.length?Math.round(ideas.filter(function(x){return x.task}).length/ideas.length*100):0;
  function row(c,n,v){return '<div class="bn-row"><span class="bn-dot" style="--c:'+c+'"></span><span class="nm">'+n+'</span><b>'+v+'%</b></div>'}
  return '<section class="panel bn-prog"><h2>Progress</h2><div class="bn-big">'+pct+'<small>%</small></div><div class="muted" style="font-size:13px">Tasks shipped</div>'+
    '<svg class="bn-chart" viewBox="0 0 240 84" role="img" aria-label="Activity over the last 14 days"><path d="'+bnLine(s.chg,240,84,mx)+'" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round"/><path d="'+bnLine(s.shp,240,84,mx)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5"/></svg>'+
    row("var(--st-s)","Shipped",pct)+row("var(--st-r)","In review",rv)+row("var(--c-ideas)","Ideas turned into tasks",conv)+'</section>';
}
function bnPreview(){
  var imgs=mine("mood").filter(function(m){return m.kind==="image"&&m.assetId}),m=imgs[imgs.length-1],f=m?S.files.filter(function(x){return x.assetId===m.assetId})[0]:null;
  var vis=m?'<img class="bn-img" src="/_blob/'+esc(m.assetId)+'" alt="'+esc(m.label||"Latest moodboard image")+'">':'<div class="bn-orbwrap"><div class="bn-orb"></div></div>';
  var nm=m?(m.label||(f&&f.name)||"Moodboard image"):"Add an image to your moodboard";
  return '<section class="panel ink bn-prev"><h2>Latest frame<button class="btn sm" data-act="view" data-id="mood">Open</button></h2>'+vis+
    '<div class="bn-cap"><b>'+esc(nm)+'</b><span>'+(f&&f.size?fmtSize(f.size):"Moodboard")+'</span></div><div class="bn-who"><span class="av sm">'+avHTML()+'</span><span>'+esc((S.profile&&S.profile.name)||"You")+'<i>'+esc(spaceName())+'</i></span></div></section>';
}
function bnFiles(){
  var files=mine("files").slice().reverse().slice(0,4).map(function(f){return {n:f.name,a:"view",id:"library"}});
  var notes=mine("notes").slice().sort(function(a,b){return b.ts-a.ts}).slice(0,4-files.length).map(function(n){return {n:(n.title||"Untitled")+".note",a:"opennote",id:n.id}});
  var all=files.concat(notes);
  return '<section class="panel bn-files"><h2>All files<button class="bn-plus" data-act="view" data-id="library" aria-label="Open library">'+I("plus")+'</button></h2>'+
    (all.length?all.map(function(x){return '<button class="bn-file" data-act="'+x.a+'" data-id="'+x.id+'"><span class="fi">'+I("notes")+'</span><span class="nm">'+esc(x.n)+'</span></button>'}).join(""):'<div class="empty">Upload a file or write a note and it shows up here.</div>')+'</section>';
}
function bnTeam(t){
  var wk=Date.now()-7*86400000,total=t.length,prog=t.filter(function(x){return x.col==="m"||x.col==="r"}).length,done=t.filter(function(x){return x.col==="s"}).length;
  var newW=t.filter(function(x){return x.ts>wk}).length,doneW=t.filter(function(x){return x.col==="s"&&(x.done||x.ts)>wk}).length,s=bnSeries(),mx=Math.max.apply(null,s.chg.concat([1]));
  function st(l,n,d,p){return '<div class="bn-st"><span>'+l+'</span><b>'+n+'</b><div class="bn-bar"><i style="width:'+Math.max(4,Math.round(p))+'%"></i></div><em>'+d+'</em></div>'}
  return '<section class="panel bn-team"><span class="av">'+avHTML()+'</span><div class="bn-tl"><b>'+esc(spaceName())+'</b><span class="muted">Overview</span></div>'+
    st("Total tasks",total,"+"+newW+" this week",100)+st("In progress",prog,prog+" active",total?prog/total*100:0)+st("Shipped",done,"+"+doneW+" this week",total?done/total*100:0)+
    '<svg class="bn-wave" viewBox="0 0 120 40" aria-hidden="true"><path d="'+bnLine(s.chg,120,40,mx)+'" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round"/></svg></section>';
}
function bnStages(t){
  var ideas=mine("ideas"),posts=mine("posts"),notes=mine("notes"),total=t.length;
  var conv=ideas.length?Math.round(ideas.filter(function(x){return x.task}).length/ideas.length*100):0;
  var making=total?Math.round(t.filter(function(x){return x.col!=="i"}).length/total*100):0;
  var pub=posts.filter(function(p){return p.status==="published"}).length,ship=posts.length?Math.round(pub/posts.length*100):(total?Math.round(t.filter(function(x){return x.col==="s"}).length/total*100):0);
  function col(title,sub,p,a,al,b,bl){
    return '<div class="bn-col"><h3>'+title+'</h3><p>'+sub+'</p><div class="bn-pr"><span>Progression</span><b>'+p+'%</b></div><div class="bn-pbar"><i style="width:'+p+'%"></i></div>'+
      '<div class="bn-cn"><span title="'+al+'">'+I("check")+a+'</span><span title="'+bl+'">'+I("star")+b+'</span></div></div>';
  }
  return '<section class="panel ink bn-stg">'+
    col("Ideas","Capture and sort",conv,ideas.length,"Ideas",ideas.filter(function(x){return x.star}).length,"Starred")+
    col("Making","Plan and build",making,t.filter(function(x){return x.col!=="s"}).length,"Open tasks",notes.length,"Notes")+
    col("Publishing","Ship and share",ship,pub,"Published posts",posts.length-pub,"Scheduled")+'</section>';
}

var vizRange=14, vizAll=false;
var VCOLS=["--c-ideas","--c-notes","--c-board","--c-mood","--c-lib","--c-wb","--c-home","--c-viz"];
function pl(n,w){return n+" "+w+(n===1?"":"s")}
function monShort(d){return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function vizSet(){
  var sp=vizAll?null:S.cur,f=function(a){return a.filter(function(x){return !sp||x.sp===sp})};
  return {tasks:f(S.tasks),ideas:f(S.ideas),notes:f(S.notes)};
}
function vizDays(D){
  var base=new Date();base.setHours(0,0,0,0);
  var days=[],idx={},i,d;
  for(i=vizRange-1;i>=0;i--){d=new Date(base);d.setDate(base.getDate()-i);idx[ymd(d)]=days.length;days.push({d:d,n:0,i:0,t:0,s:0})}
  var bump=function(arr,key){arr.forEach(function(x){var j=idx[ymd(new Date(x.ts))];if(j!=null)days[j][key]++})};
  bump(D.notes,"n");bump(D.ideas,"i");bump(D.tasks,"t");
  D.tasks.forEach(function(x){var ds=x.done||(x.col==="s"?x.ts:0);if(!ds)return;var j=idx[ymd(new Date(ds))];if(j!=null)days[j].s++});
  return days;
}
function countIn(D,from,to){
  var n=0;
  [D.notes,D.ideas,D.tasks].forEach(function(a){a.forEach(function(x){if(x.ts>=from&&x.ts<to)n++})});
  return n;
}
function spark(series){
  var n=series.length,mx=Math.max.apply(null,series.concat([1])),w=100,h=28;
  var pts=series.map(function(v,i){return [n>1?i/(n-1)*w:w/2,h-3-(v/mx)*(h-8)]});
  var line="M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("L");
  return '<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><path d="'+line+"L"+w+" "+h+"L0 "+h+'Z" style="fill:var(--c);fill-opacity:.18"/><path d="'+line+'" style="fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"/></svg>';
}
function vizDonut(cnt,total,pct){
  var R=46,C=2*Math.PI*R,off=0,segs="";
  STAGES.forEach(function(s){
    var v=cnt[s.id];if(!v)return;
    var len=v/total*C,vis=Math.max(len-(total>1?2.5:0),.5);
    segs+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke-width="16" style="stroke:'+STCOL[s.id]+'" stroke-dasharray="'+vis.toFixed(2)+" "+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    off+=len;
  });
  return '<svg class="vdonut" viewBox="0 0 120 120" role="img" aria-label="'+pct+' percent of tasks shipped"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke-width="16" style="stroke:var(--surface2)"/>'+segs+'<text x="60" y="64" text-anchor="middle" class="dn">'+pct+'%</text><text x="60" y="80" text-anchor="middle" class="dl">shipped</text></svg>';
}
function vizActivityHTML(days){
  var tot=days.map(function(x){return x.n+x.i+x.t+x.s}),mx=Math.max.apply(null,tot);
  if(!mx)return '<div class="empty">Nothing was added or edited in this period yet.</div>';
  var ymax=Math.max(4,Math.ceil(mx/4)*4),step=days.length<=7?1:(days.length<=14?2:5);
  var y=[4,3,2,1,0].map(function(k){return '<span>'+(ymax/4*k)+'</span>'}).join("");
  var seg=function(v,c){return v?'<div class="vseg" style="--c:var('+c+');height:'+(v/ymax*100)+'%"></div>':""};
  var cols=days.map(function(x){
    return '<div class="vcol" title="'+esc(monShort(x.d)+": "+pl(x.n,"note")+" edited, "+pl(x.i,"idea")+", "+pl(x.t,"task")+" added, "+pl(x.s,"task")+" shipped")+'">'+seg(x.s,"--st-s")+seg(x.t,"--c-board")+seg(x.i,"--c-ideas")+seg(x.n,"--c-notes")+'</div>';
  }).join("");
  var labels=days.map(function(x,j){return '<span>'+(((days.length-1-j)%step===0)?'<b>'+esc(monShort(x.d))+'</b>':"")+'</span>'}).join("");
  return '<div class="vplot"><div class="vy" aria-hidden="true">'+y+'</div><div class="vmain"><div class="vcols" role="img" aria-label="Activity per day">'+cols+'</div><div class="vlabels" aria-hidden="true">'+labels+'</div></div></div>'+
    '<div class="vlegend"><span><i style="background:var(--c-notes)"></i>Notes edited</span><span><i style="background:var(--c-ideas)"></i>Ideas captured</span><span><i style="background:var(--c-board)"></i>Tasks added</span><span><i style="background:var(--st-s)"></i>Tasks shipped</span></div>';
}
function vizDueHTML(D){
  var base=new Date();base.setHours(0,0,0,0);
  var todayStr=ymd(base),cols=[{l:"Late",n:0,late:true}],idx={},i,d;
  for(i=0;i<14;i++){d=new Date(base);d.setDate(base.getDate()+i);idx[ymd(d)]=cols.length;cols.push({l:String(d.getDate()),n:0,late:false})}
  D.tasks.forEach(function(t){
    if(t.col==="s"||!t.due)return;
    if(t.due<todayStr)cols[0].n++;else{var j=idx[t.due];if(j!=null)cols[j].n++}
  });
  var mx=Math.max.apply(null,cols.map(function(c){return c.n}));
  if(!mx)return '<div class="empty">No open task is due in the next two weeks.</div>';
  var bars=cols.map(function(c){
    return '<div class="vcol" title="'+esc((c.late?"Overdue":"Due "+c.l)+": "+pl(c.n,"task"))+'"><div class="vnum">'+(c.n||"")+'</div>'+(c.n?'<div class="vseg" style="--c:'+(c.late?"var(--warn)":"var(--c-board)")+';height:'+Math.round(c.n/mx*100)+'px"></div>':"")+'</div>';
  }).join("");
  var labels=cols.map(function(c,j){return '<span>'+((c.late||(j>=2&&j%2===0))?'<b'+(c.late?' style="color:var(--warn)"':"")+'>'+c.l+'</b>':"")+'</span>'}).join("");
  return '<div class="vcols due" role="img" aria-label="Open tasks by due day">'+bars+'</div><div class="vlabels" aria-hidden="true">'+labels+'</div>';
}
function vizHeat(D){
  var base=new Date();base.setHours(0,0,0,0);
  var W=20,dow=(base.getDay()+6)%7,start=new Date(base);start.setDate(base.getDate()-dow-(W-1)*7);
  var counts={};
  [D.notes,D.ideas,D.tasks].forEach(function(a){a.forEach(function(x){var k=ymd(new Date(x.ts));counts[k]=(counts[k]||0)+1})});
  var cells=[],mx=0,active=0,best=null,i,d,n,fut;
  for(i=0;i<W*7;i++){
    d=new Date(start);d.setDate(start.getDate()+i);fut=d>base;n=fut?0:(counts[ymd(d)]||0);
    if(n){active++;if(!best||n>best.n)best={n:n,d:d}}
    mx=Math.max(mx,n);cells.push({d:d,n:n,fut:fut});
  }
  var streak=0;
  for(i=0;i<400;i++){d=new Date(base);d.setDate(base.getDate()-i);if(counts[ymd(d)])streak++;else if(i>0)break}
  var lvl=function(v){if(!v)return 0;var r=v/mx;return r>.75?4:(r>.5?3:(r>.25?2:1))};
  var months="";
  for(var c=0;c<W;c++){
    var cd=cells[c*7].d,pd=c?cells[(c-1)*7].d:null;
    months+='<span>'+((!pd||cd.getMonth()!==pd.getMonth())?cd.toLocaleDateString("en-IN",{month:"short"}):"")+'</span>';
  }
  var grid=cells.map(function(x){return '<i class="hc '+(x.fut?"f":"l"+lvl(x.n))+'" title="'+esc(monShort(x.d)+": "+pl(x.n,"change"))+'"></i>'}).join("");
  return '<div class="vheatrow"><div class="vstats"><div><b>'+streak+'</b><span>day streak</span></div><div><b>'+active+'</b><span>active days of '+(W*7)+'</span></div><div><b>'+(best?best.n:0)+'</b><span>'+(best?"most in one day, "+esc(monShort(best.d)):"most in one day")+'</span></div></div>'+
    '<div class="vheatscroll"><div class="vmonths" aria-hidden="true">'+months+'</div><div class="vhgrid" role="img" aria-label="Activity per day over the last '+W+' weeks">'+grid+'</div>'+
    '<div class="vlegend" style="margin-top:10px"><span>Less</span><i class="hc l0"></i><i class="hc l1"></i><i class="hc l2"></i><i class="hc l3"></i><i class="hc l4"></i><span>More</span></div></div></div>';
}
function vizInsights(D,days){
  var out=[],today=ymd(new Date());
  var open=D.tasks.filter(function(t){return t.col!=="s"}),done=D.tasks.length-open.length;
  if(D.tasks.length)out.push(done+" of "+pl(D.tasks.length,"task")+" shipped ("+Math.round(done/D.tasks.length*100)+"%).");
  var late=open.filter(function(t){return t.due&&t.due<today}).sort(function(a,b){return a.due<b.due?-1:1});
  if(late.length)out.push(pl(late.length,"task")+" overdue. The oldest is “"+esc(late[0].title)+"”, due "+fmtDue(late[0].due)+".");
  var rev=open.filter(function(t){return t.col==="r"}).length;
  if(rev)out.push(pl(rev,"task")+" waiting in Review.");
  var loose=D.ideas.filter(function(i){return !i.task}),starred=loose.filter(function(i){return i.star}).length;
  if(loose.length)out.push(pl(loose.length,"idea")+" not yet turned into tasks"+(starred?", "+starred+" starred":"")+".");
  var best=null;days.forEach(function(x){var n=x.n+x.i+x.t+x.s;if(n&&(!best||n>best.n))best={n:n,d:x.d}});
  if(best)out.push("Busiest day in this period: "+monShort(best.d)+", with "+pl(best.n,"change")+".");
  if(!out.length)out.push("Add tasks, ideas or notes and this page fills in.");
  return out;
}

  h+='<div class="vz-tiles">'+tiles.map(function(t){

      (t.bar!=null?'<span class="vt-bar"><i style="width:'+t.bar+'%"></i></span>':"")+(t.sp?spark(t.sp):"")+'</div>';

/* ---------- focus timer ---------- */
var FT={mode:"f",left:1500,run:false,end:0,tick:null},FTLEN={f:1500,b:300};
function fmtT(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function ftPaint(){
  var e=$("ftimer");if(!e)return;
  e.dataset.run=FT.run;e.dataset.mode=FT.mode;
  e.innerHTML='<button class="ftb" data-act="ftoggle" aria-label="'+(FT.run?"Pause":"Start")+' timer">'+I(FT.run?"pause":"play")+'</button><span class="ftt" id="ftt" aria-live="off">'+fmtT(FT.left)+'</span><button class="ftm" data-act="ftmode" title="Switch between focus and break">'+(FT.mode==="f"?"Focus":"Break")+'</button>'+((FT.run||FT.left!==FTLEN[FT.mode])?'<button class="ico" data-act="ftreset" aria-label="Reset timer">'+I("undo")+'</button>':"");
}
function ftTick(){
  FT.left=Math.max(0,Math.round((FT.end-Date.now())/1000));
  if(FT.left<=0){ftDone();return}
  var t=$("ftt");if(t)t.textContent=fmtT(FT.left);
  document.title=fmtT(FT.left)+" · Creator Space";
}
function ftDone(){
  clearInterval(FT.tick);FT.run=false;document.title="Creator Space";
  if(FT.mode==="f"){var k=ymd(new Date());S.focus[k]=(S.focus[k]||0)+25;if(!readOnly)touch();toast("Focus session done. Take a 5 minute break.");FT.mode="b"}
  else{toast("Break over. Ready for another round?");FT.mode="f"}
  FT.left=FTLEN[FT.mode];ftPaint();if(S.view==="home")render();
}
function ftToggle(){
  if(FT.run){clearInterval(FT.tick);FT.run=false;document.title="Creator Space"}
  else{FT.end=Date.now()+FT.left*1000;FT.run=true;FT.tick=setInterval(ftTick,500)}
  ftPaint();
}
function ftReset(){clearInterval(FT.tick);FT.run=false;FT.left=FTLEN[FT.mode];document.title="Creator Space";ftPaint()}
function ftSwitch(){clearInterval(FT.tick);FT.run=false;FT.mode=FT.mode==="f"?"b":"f";FT.left=FTLEN[FT.mode];document.title="Creator Space";ftPaint()}

/* ---------- command palette ---------- */
var PAL={open:false,q:"",sel:0,items:[]};
function palBuild(){
  var q=PAL.q.trim(),ql=q.toLowerCase(),out=[];

  if(!readOnly){
    add("Create","New note","notes","var(--c-notes)",function(){newNote()});
    if(q){
      add("Create","Add idea: "+q,"bulb","var(--c-ideas)",function(){addIdeaText(q,false)});

    }

  add("Actions","How to share this space","users","var(--c-home)",showShare);
  add("Actions","Switch light or dark theme","moon","var(--c-home)",toggleTheme);
  add("Actions","Keyboard shortcuts","cmd","var(--c-home)",showShortcuts);
  add("Actions","Data and backup","folder","var(--c-home)",dataOpen);
  add("Actions","Profile and appearance","users","var(--c-home)",function(){profOpenDlg(true)});
  out=out.filter(function(i){return !ql||i.l.toLowerCase().indexOf(ql)>-1});
  if(ql.length>1){
    var hit=function(txt){return String(txt||"").toLowerCase().indexOf(ql)>-1},found=[];
    S.notes.forEach(function(n){if(hit(n.title+" "+n.body))found.push({g:"Found",l:n.title||"Untitled note",ic:"notes",c:"var(--c-notes)",fn:function(){S.cur=n.sp;S.view="notes";selNote=n.id;touch();render()}})});
    S.ideas.forEach(function(i){if(hit(i.text))found.push({g:"Found",l:i.text,ic:"bulb",c:"var(--c-ideas)",fn:function(){S.cur=i.sp;S.view="ideas";touch();render()}})});
    S.tasks.forEach(function(t){if(hit(t.title))found.push({g:"Found",l:t.title,ic:"board",c:"var(--c-board)",fn:function(){S.cur=t.sp;S.view="board";touch();render()}})});
    out=out.concat(found.slice(0,6));

/* ---------- whiteboard ---------- */
var WB={items:[],sel:null,filter:"all",connFrom:null,ik:"",ck:"",tl:"",mini:null,miniDrag:false,pendImg:null,tool:"select",color:"#12163A",width:3,fill:false,px:40,py:40,z:1,hist:[],redo:[],loadedFor:null,dirty:false,saving:false,timer:null,drag:null,draft:null,edit:null,raf:0};

var WBM={};
async function wbPush(sp,json){
  var p=splitStr(json),h=hsh(json),old=(WBM[sp]&&WBM[sp].n)||0;
  for(var i=0;i<p.length;i++)await db.doc("bd/"+sp+"_"+i).set({s:p[i],i:i});
  await db.doc("bd/"+sp+"_m").set({n:p.length,h:h,ts:Date.now(),dev:TAB});
  for(var j=p.length;j<old;j++)await db.doc("bd/"+sp+"_"+j).delete();
  WBM[sp]={n:p.length,h:h};
}
async function wbPullRemote(sp){
  var m=await db.doc("bd/"+sp+"_m").get();
  if(m.exists&&m.data()){
    var md=m.data(),s="";
    for(var i=0;i<md.n;i++){var d=await db.doc("bd/"+sp+"_"+i).get();if(!d.exists)throw {code:"partial"};s+=d.data().s}
    if(hsh(s)!==md.h)throw {code:"partial"};
    WBM[sp]={n:md.n,h:md.h};
    var a=JSON.parse(s);return Array.isArray(a)?a:null;
  }
  var lg=await db.doc("boards/"+sp).get();
  if(lg.exists&&lg.data()&&Array.isArray(lg.data().items))return lg.data().items;
  return null;
}
function wbPendKey(sp){return LS+"-wbp-"+sp}
function wbLoad(sp){
  if(WB.dirty&&WB.loadedFor&&WB.loadedFor!==sp&&db&&!readOnly){var oldSp=WB.loadedFor,oldJ=JSON.stringify(WB.items);wbPush(oldSp,oldJ).then(function(){try{localStorage.removeItem(wbPendKey(oldSp))}catch(e){}}).catch(function(){})}

  try{var raw=localStorage.getItem(wbKey(sp));if(raw){var a=JSON.parse(raw);if(Array.isArray(a))WB.items=a}}catch(e){}
  if(db){
    wbPullRemote(sp).then(function(remote){
      if(WB.loadedFor!==sp||!remote)return;
      var pend=false;try{pend=!!localStorage.getItem(wbPendKey(sp))}catch(e){}
      var rj=JSON.stringify(remote);
      if(rj===JSON.stringify(WB.items))return;
      if(WB.dirty||pend){
        var before=JSON.stringify(WB.items);
        WB.items=mergeVal(WB.items,clone(remote));
        if(JSON.stringify(WB.items)!==before){wbTouch()}
      }else{WB.items=clone(remote);try{localStorage.setItem(wbKey(sp),JSON.stringify(WB.items))}catch(e){}}
      if(S.view==="wb")wbPaint();

  }
}
function wbTouch(){
  WB.dirty=true;

  clearTimeout(WB.timer);WB.timer=setTimeout(wbFlush,900);

function wbFlush(){
  clearTimeout(WB.timer);
  if(!WB.dirty)return;
  if(!db||readOnly)return;
  if(WB.saving){WB.timer=setTimeout(wbFlush,400);return}
  var sp=WB.loadedFor,json=JSON.stringify(WB.items);
  WB.saving=true;
  wbPush(sp,json).then(function(){
    WB.saving=false;WB.retry=0;
    if(sp===WB.loadedFor){
      if(JSON.stringify(WB.items)===json){WB.dirty=false;try{localStorage.removeItem(wbPendKey(sp))}catch(e){}}
      else WB.timer=setTimeout(wbFlush,300);
    }else{try{localStorage.removeItem(wbPendKey(sp))}catch(e){}}
  }).catch(function(e){
    WB.saving=false;

    if(c==="invalid_argument"||c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){return}
    WB.retry=(WB.retry||0)+1;
    WB.timer=setTimeout(wbFlush,Math.min(60000,2000*Math.pow(2,WB.retry)));
  });
}

  if(it.t==="pen"){
    var xs=it.pts.map(function(p){return p[0]}),ys=it.pts.map(function(p){return p[1]});
    var x0=Math.min.apply(null,xs),y0=Math.min.apply(null,ys);
    return {x:x0,y:y0,w:Math.max.apply(null,xs)-x0,h:Math.max.apply(null,ys)-y0};
  }
  if(it.t==="line"){
    var lx=Math.min(it.x1,it.x2),ly=Math.min(it.y1,it.y2);
    return {x:lx,y:ly,w:Math.abs(it.x2-it.x1),h:Math.abs(it.y2-it.y1)};

    return {x:it.x,y:it.y,w:Math.max(60,mx*it.size*0.62+8),h:lines.length*it.size*1.35};
  }

}

    var da=dl+"M"+r1(h1x)+" "+r1(h1y)+"L"+it.x2+" "+it.y2+"L"+r1(h2x)+" "+r1(h2y);

  var A=wbBox(a),B=wbBox(b),ac={x:A.x+A.w/2,y:A.y+A.h/2},bc={x:B.x+B.w/2,y:B.y+B.h/2},dx=bc.x-ac.x,dy=bc.y-ac.y,x1,y1,x2,y2,d;

function wbSpark(vals,x0,x1,y0,y1){
  if(vals.length<2)return"";

  var pts=vals.map(function(v,i){return [x0+(x1-x0)*i/(vals.length-1),y1-(y1-y0)*((v-mn)/rg)]});
  var d="M"+r1(pts[0][0])+" "+r1(pts[0][1]);

}

function wbMove(e){

function wbUp(e){

function wbDbl(e){

  }
}

/* delta between the newest snapshot and the oldest one inside a time window */
function deltaOf(arr,field,ms){
  if(!arr||arr.length<2)return null;
  var last=arr[arr.length-1],lv=last[field];if(lv==null)return null;
  var cut=new Date(last.ts).getTime()-ms,base=null;
  for(var i=0;i<arr.length-1;i++){if(new Date(arr[i].ts).getTime()>=cut){base=arr[i];break}}
  if(!base||base[field]==null)return null;
  if(new Date(last.ts).getTime()-new Date(base.ts).getTime()<20*60*1000)return null;
  return lv-base[field];
}
function deltaHTML(d,label){
  if(d==null)return '<em class="dl">Tracking started</em>';
  if(d===0)return '<em class="dl">No change '+label+'</em>';

    }
    return {ok:true,data:r.data};
  }catch(e){return {ok:false,err:{error:"network",message:"Could not reach the server. Check your connection."}}}
}
async function audLoad(quiet){
  if(W.loading)return;W.loading=true;
  try{
    var c=await WSB.from("connections").select("*").order("created_at",{ascending:true});
    if(c.error)throw c.error;
    var conns=c.data||[],ids=conns.map(function(x){return x.id}),snaps={},vids={};
    if(ids.length){
      var since=new Date(Date.now()-35*864e5).toISOString();
      var s=await WSB.from("snapshots").select("connection_id,ts,followers,views,posts").in("connection_id",ids).gte("ts",since).order("ts",{ascending:true}).limit(3000);
      if(s.error)throw s.error;
      (s.data||[]).forEach(function(x){(snaps[x.connection_id]=snaps[x.connection_id]||[]).push(x)});
      var v=await WSB.from("videos").select("*").in("connection_id",ids).order("published_at",{ascending:false}).limit(300);
      if(v.error)throw v.error;
      (v.data||[]).forEach(function(x){(vids[x.connection_id]=vids[x.connection_id]||[]).push(x)});
    }
    W.conns=conns;W.snaps=snaps;W.vids=vids;W.loaded=true;W.err="";
  }catch(e){W.err="Couldn't load your channels. "+((e&&e.message)||"");if(!W.loaded)W.loaded=true}
  W.loading=false;
  if(S.view==="aud")audPaint();
}
async function audRefresh(force){
  if(W.busy)return;W.busy=true;audPaintBtn();
  var r=await ytCall({refresh:true,force:!!force});
  W.busy=false;W.lastRefresh=Date.now();var wasCfg=W.cfg;
  if(!r.ok){
    if(r.err.error==="not_configured"){W.cfg=false}
    else if(force){toast(r.err.message||"Couldn't refresh")}
  }else{W.cfg=true;if(force)toast(r.data.refreshed?"Numbers updated":"Already up to date")}

    case "aud_gsave":{var gi=$("ag-in"),gv=numOrNull(gi&&gi.value);if(gv!==null&&(isNaN(gv)||gv<1)){toast("Enter a whole number above zero");return true}
      WSB.from("connections").update({goal:gv}).eq("id",id).then(function(r){if(r.error){toast("Couldn't save the goal")}else{var c=W.conns.filter(function(x){return x.id===id})[0];if(c)c.goal=gv;W.goalEd=null;audPaint();toast(gv?"Goal saved":"Goal cleared")}});return true}
    case "aud_plat":W.plat=id;render();return true;
    case "aud_kind":W.kind=id;render();return true;
    case "aud_add":audAdd();return true;
    case "aud_addm":audAddManual();return true;
    case "aud_refresh":audRefresh(true);return true;
    case "aud_reload":audLoad();return true;
    case "aud_man":W.manual=id;audPaint();return true;
    case "aud_mcancel":W.manual=null;audPaint();return true;
    case "aud_msave":audSaveManual(id);return true;
    case "aud_pub":{var on=!!b.checked;WSB.from("connections").update({show_public:on}).eq("id",id).then(function(r){if(r.error){toast("Couldn't change that");audLoad()}else{var c=W.conns.filter(function(x){return x.id===id})[0];if(c)c.show_public=on;toast(on?"Shown on your public page":"Hidden from your public page")}});return true}
    case "aud_del":arm(b,function(){WSB.from("connections").delete().eq("id",id).then(function(r){if(r.error)toast("Couldn't remove it");else{W.conns=W.conns.filter(function(c){return c.id!==id});audPaint();toast("Removed")}})});return true;
    case "cp_save":cpSave();return true;
    case "cp_acc":W.p.accent=id;render();return true;
    case "cp_ladd":W.p.links.push({label:"",url:""});render();return true;
    case "cp_ldel":W.p.links.splice(+id,1);render();return true;
    case "cp_pub":W.p.is_public=!!b.checked;return true;
    case "cp_avatar":{var f=$("cpfile");if(f)f.click();return true}
    case "cp_avrm":W.p.avatar_url="";render();return true;
    case "cp_copy":copy(cpLink());return true;
    case "cp_open":window.open(cpLink(),"_blank","noopener");return true;
    case "cp_pw":WSB.auth.resetPasswordForEmail(window.__EMAIL||"",{redirectTo:location.origin}).then(function(r){toast(r.error?"Couldn't send the email":"Reset link sent to your email")});return true;
    case "signout":arm(b,function(){
      if(typeof SY!=="undefined"&&SY.pending&&navigator.onLine!==false){toast("Finishing your last save. Try again in a moment.");syFlush&&syFlush();return}
      try{if(typeof SY==="undefined"||!SY.pending){["","-meta","-snap","-pref","-theme"].forEach(function(x){localStorage.removeItem(LS+x)})}}catch(e){}
      window.__signOut();
    });return true;
  }
  return false;
}
document.addEventListener("input",function(e){
  var t=e.target,w=t&&t.dataset&&t.dataset.w;if(!w)return;
  if(w.indexOf("p.")===0&&W.p){W.p[w.slice(2)]=t.value;cpPreviewPaint()}
  else if(w.indexOf("l.")===0&&W.p){var m=w.split(".");var l=W.p.links[+m[1]];if(l){l[m[2]]=t.value;cpPreviewPaint()}}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.id==="cpfile"){
    var f=t.files&&t.files[0];t.value="";if(!f||!W.p)return;
    if(!/^image\//.test(f.type)){toast("Choose an image");return}
    if(f.size>5*1048576){toast("Choose a photo under 5 MB");return}

    assets.upload(f).then(function(r){W.p.avatar_url=r.url;render();toast("Photo added. Save the page to publish it.")}).catch(function(){toast("Upload failed. Try again.")});
  }
});

function webView(v){
  if(v==="aud"){if(!W.loaded&&!W.loading)audLoad();return audHTML()}
  if(v==="cp")return cpHTML();
  return null;
}
function webMount(v){
  clearInterval(W.timer);W.timer=null;
  if(v==="aud"){
    ["a.in","a.h","a.fo","a.vw","a.po"].forEach(function(){});
    if(Date.now()-W.lastRefresh>60000)audRefresh(false);
    W.timer=setInterval(function(){
      if(S.view!=="aud"||document.visibilityState==="hidden"||W.busy)return;
      W.tick++;if(W.tick%5===0)audRefresh(false);else audLoad(true);
    },60000);
  }
}
