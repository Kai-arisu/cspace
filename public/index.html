html,body{background:var(--bg)!important;color:var(--fg)}
body{font:400 14px/1.45 var(--f-body)!important;font-variant-numeric:tabular-nums;letter-spacing:0!important;font-feature-settings:normal!important;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (pointer:fine){html{overscroll-behavior:none}}
h1,h2,h3,h4{letter-spacing:-.01em;text-wrap:balance}
.num,.td-stat b,.vz-tile b,.ins-tiles b,.tm-stats b,.ins-n b,.is-row b,.ib-v,.ic-r span,.brow,.bk-f,td{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft);color:var(--fg)}
:focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}
*{transition-property:background-color,border-color,color,opacity,transform,box-shadow}

/* no tracked capitals anywhere */
.slbl,.slbl.g,.td-eyebrow,.cal-sec,.tm-det h4,.bgrp,.mb-kick,.cw,.ms-g,.ins-tips h3,.kt-h b,.cc-h .cw{text-transform:none!important;letter-spacing:0!important}

/* ---------------- shell: open plane ---------------- */
.app{grid-template-columns:240px minmax(0,1fr)!important;background:var(--bg)!important}
.side{background:var(--side-bg)!important;border-right:1px solid var(--line)!important;padding:14px 12px 0!important;gap:0!important}
.brand{padding:4px 8px 12px!important}
.brand b{font:600 15px var(--f-body)!important;letter-spacing:-.01em}
.brand .logo,#logo{background:var(--accent)!important;color:var(--accent-fg)!important;border-radius:8px!important}
.sidetools{display:flex;flex-direction:column;gap:6px;padding:0 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sidetools .qwrap{position:relative}
.sidetools .btn.pri{width:100%;justify-content:center;height:36px}
.sidetools .search{max-width:none!important;width:100%;position:relative}
.sidetools #gsearch{height:34px!important;background:var(--surface)!important;border:1px solid transparent!important;padding-left:32px!important}
.sidetools #gsearch:hover{border-color:var(--line)!important}
.sidetools .sres{left:0!important;right:auto!important;width:min(520px,70vw)!important;top:40px!important}
.sidetools .bellwrap{position:relative}
.sidetools #bellbtn{width:100%!important;height:32px!important;display:flex!important;align-items:center;gap:10px;padding:0 10px!important;justify-content:flex-start;border-radius:8px!important;color:var(--muted)!important;font:400 14px var(--f-body)}
.sidetools #bellbtn::after{content:"Notifications";color:var(--fg)}
.sidetools #bellbtn:hover{background:var(--surface2)!important}
.sidetools #bellbtn svg{width:16px;height:16px;flex:none}
.sidetools #bellbtn .bdg{position:static!important;margin-left:auto;order:2;border:0!important;background:var(--warn)!important;min-width:20px;height:20px;line-height:20px;font-size:11.5px}
.sidetools .bellm{left:calc(100% + 12px)!important;right:auto!important;top:-8px!important;width:360px!important}
.sidetools .qmenu{left:0!important;right:auto!important;top:42px!important;width:100%!important}
.sidetools .ftimer{width:100%;justify-content:center}
.slbl,.slbl.g{font:500 12.5px var(--f-body)!important;color:var(--muted)!important;padding:18px 10px 6px!important}
#nav{border-top:0!important;margin-top:0!important;padding-top:0!important}
.si-row{min-height:32px;padding:6px 10px!important;margin:1px 0;border-radius:8px!important;font:400 14px var(--f-body)!important;color:var(--fg)!important;box-shadow:none!important}
.si-row .tile{color:var(--muted)!important}
.si-row:hover{background:var(--surface2)!important}
.si-row[aria-current="true"]{background:var(--active)!important;box-shadow:none!important;font-weight:500!important}
.si-row[aria-current="true"] .tile{color:var(--fg)!important}
.si-row .ct.hot{background:var(--warn-soft)!important;color:var(--warn)!important}
#spaces .si-row .dot,#spaces .si-row i.sd{width:8px;height:8px}
.sadd .sbtn{color:var(--muted)!important}
.status{color:var(--muted)!important}
.pcard{background:var(--side-bg)!important;border-top:1px solid var(--line)!important}
.pcard:hover{background:var(--surface2)!important}
.pcard .av,.av{background:var(--surface3)!important;color:var(--fg)!important}

@media (min-width:821px){
  .top{display:none!important}
}
.wrap{max-width:1152px!important;padding:36px 40px 80px!important}
.col-main[data-v="home"] .wrap{max-width:1100px!important;padding-top:72px!important}

/* ---------------- titles ---------------- */
.hero{margin-bottom:24px!important;align-items:flex-end!important;gap:16px!important}
.hero h1{font:600 24px/1.25 var(--f-body)!important;letter-spacing:-.01em!important;margin:0 0 4px!important}
.hero p{font-size:14px!important;color:var(--muted)!important}

/* ---------------- surfaces ---------------- */
.panel,.acard,.pp-card{background:var(--surface)!important;border:0!important;border-radius:var(--r-card)!important;box-shadow:none!important;padding:20px!important}
.panel h2,.panel h3,.acard h2{font:600 14px var(--f-body)!important;letter-spacing:0!important;color:var(--fg)}
.panel .panel{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:var(--r-inner)!important}
.empty{color:var(--muted)!important}
.muted{color:var(--muted)!important}

/* buttons: pills; primary near-black; accent on data, not chrome */
.btn{height:36px;border-radius:999px!important;border:1px solid var(--line2)!important;background:var(--card)!important;color:var(--fg)!important;font:500 13.5px var(--f-body)!important;padding:0 16px!important;box-shadow:none!important}
.btn:hover{background:var(--surface2)!important;border-color:var(--muted)!important}
.btn.pri{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--on-ink)!important}
.btn.pri:hover{background:var(--ink)!important;opacity:.88}
.btn.sm{height:30px;padding:0 12px!important;font-size:12.5px!important}
.btn.danger{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
.chip{border-radius:999px!important;border:1px solid var(--line2)!important;background:var(--card)!important;color:var(--fg)!important;padding:5px 12px!important;font:500 12.5px var(--f-body)!important}
.chip:hover{border-color:var(--muted)!important}
.chip[aria-pressed="true"]{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--on-ink)!important}
.hd-seg,.cp-tabs{background:var(--surface2)!important;border-radius:999px!important;padding:3px!important}
.hd-seg button,.cp-tabs button{border-radius:999px!important;color:var(--muted)!important}
.hd-seg button[aria-pressed="true"],.cp-tabs button[aria-selected="true"]{background:var(--card)!important;color:var(--fg)!important;box-shadow:0 0 0 1px var(--line)!important}

/* fields: white, 1px, radius 10, 40px */
.in,input.in,select.in,textarea.in,.wsel,#gsearch,.capture .in{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:var(--r-field)!important;color:var(--fg)!important;font-size:14px!important}
input.in,select.in,.wsel{min-height:38px}
.in:hover,.wsel:hover{border-color:var(--line2)!important}
.in:focus,.wsel:focus,#gsearch:focus{border-color:var(--accent-line)!important;box-shadow:0 0 0 3px var(--accent-soft)!important}
.in::placeholder,#gsearch::placeholder{color:var(--faint)!important}
select{background-color:var(--card)!important;color:var(--fg)!important}
.plab{font:500 13px var(--f-body)!important;color:var(--fg)!important}

/* menus float: the only shadows */
.qmenu,.bellm,.sres,.pmenu,.profm,.palbox,.dlgbox{background:var(--card)!important;box-shadow:var(--pop)!important;border-radius:16px!important}
.dlgbox{border-radius:22px!important}
.toast{background:var(--ink)!important;color:var(--on-ink)!important;border-radius:999px!important}
.bgrp{font:500 12.5px var(--f-body)!important;color:var(--muted)!important}

/* icons stand alone: no tinted squares */
.bic,.bic.k0,.bic.k1{background:none!important;color:var(--muted)!important;width:20px!important;height:20px!important}
.bic.k0{color:var(--warn)!important}
.ecard .ec-i,.fdrop .ec-i{background:none!important;color:var(--muted)!important;width:28px!important;height:28px!important}
.ecard{background:var(--surface)!important;border:1px dashed var(--line2)!important;border-radius:var(--r-card)!important}
.fdrop{background:var(--surface)!important;border-radius:var(--r-card)!important}

/* status pills: pale pair, dark ink */
.dchip{background:var(--surface2)!important;color:var(--muted)!important;border-radius:999px!important}
.dchip.none{background:none!important}
.dchip.late{background:var(--warn-soft)!important;color:var(--warn)!important}
.dchip.today{background:var(--accent-soft)!important;color:var(--accent)!important}
.ct.hot{background:var(--warn-soft)!important;color:var(--warn)!important}
.bdg{background:var(--warn)!important}
.tag,.bk-tags span{background:var(--surface2)!important;color:var(--muted)!important;border-radius:999px!important}
.bk-k{background:var(--surface2)!important;color:var(--fg)!important;border-radius:999px!important}
.k-hook .bk-k{background:var(--amber-soft)!important;color:var(--amber)!important}
.k-tags .bk-k{background:var(--accent-soft)!important;color:var(--accent)!important}
.ins-bk{background:var(--ok-soft)!important;color:var(--ok)!important;border-radius:999px!important}
.tm-badge{border-radius:999px!important}

/* data hue: the one accent on the main data element */
.ib.best .ib-b i,.is-row.best .is-bar i,.td-gl span,.ob-bar i,.ccd.today .n{background:var(--accent)!important;color:var(--accent-fg)!important}
.ib.best .ib-v,.ib.best .ib-l,.is-row.best span:first-child,.is-row.best b,.ins-tips b{color:var(--accent)!important}
.ccd.sel{background:var(--accent-soft)!important;border-color:var(--accent-line)!important}
.vz-tile svg path,.vz-tile svg polyline{stroke:var(--accent)}

/* ---------------- board ---------------- */
.board .col{background:var(--surface)!important;border-radius:var(--r-card)!important;padding:12px!important}
.card{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:var(--r-inner)!important;box-shadow:none!important}
.card.late{box-shadow:inset 3px 0 0 var(--warn)!important}
.card .who{background:var(--surface2)!important;color:var(--fg)!important;border-radius:999px!important}

/* ---------------- lists ---------------- */
.idea,.bk-card,.clip,.acard,.tm-card{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:var(--r-inner)!important;box-shadow:none!important}
.capture{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:999px!important;padding:5px 5px 5px 14px!important}
.capture .in{border:0!important;box-shadow:none!important;background:none!important}
.ncard[aria-current="true"]{background:var(--card)!important;border-color:var(--line)!important;box-shadow:none!important}
.vz-tile,.td-stat,.tm-stats .stat,.stat{background:var(--surface)!important;border:0!important;border-radius:var(--r-card)!important;box-shadow:none!important}
.cl-th.noimg{background:var(--surface2)!important}
.cl-th.noimg span{color:var(--muted)!important}

/* ---------------- phone ---------------- */
@media (max-width:820px){
  .top{display:flex!important;background:var(--bg)!important;border-bottom:1px solid var(--line)!important}
  .wrap,.col-main[data-v="home"] .wrap{padding:20px 16px 110px!important}
  .hero h1{font-size:22px!important}
  .tabbar{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:var(--pop)!important;border-radius:22px!important}
  .tabbar [aria-current="true"]{color:var(--fg)!important;background:var(--active)!important}
  input,select,textarea{font-size:16px!important}
}

/* inspector round 1 */
.tabbar button,.tabbar a,.tabbar [aria-current="true"]{box-shadow:none!important}
.ico{background:none!important;box-shadow:none!important}
.ico:hover{background:var(--surface2)!important}
.ob-c{background:none!important;color:var(--accent)!important;border:1.5px solid var(--line2)!important}
.ob-l li.done .ob-c{background:none!important;border-color:var(--accent)!important;color:var(--accent)!important}
.dl.up,.td-ac .dl.up{color:var(--ok)!important}.dl.down,.td-ac .dl.down{color:var(--warn)!important}

/* ---------------- Today: editorial greeting on a 12-col grid ---------------- */
.col-main[data-v="home"] .wrap>*{max-width:1100px;margin-left:auto;margin-right:auto}
.td-head{padding:0!important;margin:0 0 24px!important;display:block!important}
.td-head .td-date{margin:0 0 10px;font:400 14px var(--f-body);color:var(--muted)}
.td-head h1{font:400 48px/1.05 var(--f-serif)!important;letter-spacing:-.01em!important;margin:0!important;color:var(--fg)}
.td-head .td-fact{margin:12px 0 0;font:400 16px/1.45 var(--f-body);color:var(--muted);max-width:62ch}
.td-cap{display:flex;gap:8px;margin:0 0 50px!important}
.td-cap .in{flex:1;height:40px!important;background:var(--card)!important;border-radius:999px!important;padding:0 18px!important}
.td-cap .btn{height:40px}
.td-grid{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:16px!important;margin:0 0 16px!important}
.td-grid>.s12{grid-column:span 12}.td-grid>.s9{grid-column:span 9}.td-grid>.s6{grid-column:span 6}.td-grid>.s3{grid-column:span 3}
.td-stats>.td-stat{grid-column:span 3;min-height:128px;padding:16px!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:space-between!important;gap:6px;text-align:left;background:var(--surface)!important;border:0!important;border-radius:var(--r-card)!important;color:var(--fg)}
.td-stats>.td-stat:hover{background:var(--surface2)!important}
.td-stat .tl{font:500 13px var(--f-body);color:var(--fg)}
.td-stat b{font:400 32px/1 var(--f-body)!important;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--fg)}
.td-stat.warn b{color:var(--warn)!important}
.td-stat .tc{font:400 12.5px var(--f-body);color:var(--muted)}
.td-ft .tf-row{width:100%}
.td-ft .tf-t{font:400 32px/1 var(--f-body)!important;letter-spacing:-.01em}
.td-ft>span:last-child{font-size:12.5px;color:var(--muted)}
.td-grid{align-items:start}
.td-grid>.panel{margin:0!important;min-width:0}
.td-ft::before{content:"Focus timer";font:500 13px var(--f-body);color:var(--fg)}
.td-grid>.panel h2{display:flex;align-items:center;gap:8px;margin:0 0 14px!important;font:600 14px var(--f-body)!important}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:500 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.lnk{margin-left:auto;border:0;background:none;padding:4px 0;color:var(--fg);font:500 13px var(--f-body);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--fg)}
.td-rows{display:flex;flex-direction:column;gap:8px}
.td-row{display:flex!important;align-items:center;gap:12px;min-height:63px;padding:10px 16px!important;background:var(--card)!important;border:1px solid var(--line)!important;border-radius:14px!important;text-align:left;width:100%;color:var(--fg)}
.td-row:hover{border-color:var(--line2)!important;background:var(--card)!important}
.td-row .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.td-row .bt b{font:500 14px var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-row .bt i{font:400 12.5px var(--f-body);font-style:normal;color:var(--muted)}
.td-row.late .bt i{color:var(--warn)}
.td-row>svg{width:16px;height:16px;color:var(--muted);flex:none}
.td-row.item{justify-content:space-between}
.td-row.item .t{flex:1;min-width:0;font-size:14px}
.td-ia{display:flex;gap:6px;flex:none}
.td-day{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.td-day:first-of-type{border-top:0;padding-top:0}
.td-dl{font:500 13px var(--f-body);color:var(--muted);padding-top:9px}
.td-day>div{display:flex;flex-direction:column;gap:6px}
.td-ev{display:flex!important;align-items:center;gap:10px;min-height:40px;padding:8px 12px!important;background:var(--card)!important;border:1px solid var(--line)!important;border-radius:12px!important;font:400 14px var(--f-body);color:var(--fg);text-align:left;width:100%}
.td-ev i{width:6px;height:6px;border-radius:50%;background:var(--fg);flex:none}
.td-ev.post i{background:var(--accent)}
.td-ev em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.td-pins{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.td-pipe{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.td-pipe button{display:flex!important;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 16px!important;background:var(--card)!important;border:1px solid var(--line)!important;border-radius:14px!important;color:var(--fg);text-align:left}
.td-pipe button span{font:500 13px var(--f-body);color:var(--muted)}
.td-pipe button b{font:400 28px/1 var(--f-body);font-variant-numeric:tabular-nums}
.td-pipe em{display:none}
/* the signature: road to the next milestone */
.td-road{display:flex;flex-direction:column}
.td-road>p{margin:0 0 14px;font-size:13.5px;line-height:1.5}
.td-roadc{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.td-roadc:hover{border-color:var(--line2)}
.td-roadc .tl{font:500 13px var(--f-body);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function sndCtx(){

  if(SND.ctx.state==="suspended")SND.ctx.resume();return SND.ctx;

function sndNote(c,out,f0,f1,t,dur,vol){
  var o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.02);
}
function sound(kind){
  if(!sndOn()||document.visibilityState==="hidden")return;
  var c=sndCtx();if(!c)return;
  var now=c.currentTime;if(kind==="tick"&&now-SND.last<0.06)return;SND.last=now;
  var lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
  var m=c.createGain();m.gain.value=0.9;lp.connect(m);m.connect(c.destination);
  if(kind==="collapse"){sndNote(c,lp,640,430,now,0.16,0.09);sndNote(c,lp,430,290,now+0.07,0.22,0.07)}
  else if(kind==="expand"){sndNote(c,lp,290,430,now,0.16,0.07);sndNote(c,lp,430,660,now+0.07,0.22,0.09)}
  else if(kind==="on"){sndNote(c,lp,520,780,now,0.14,0.08)}
  else{sndNote(c,lp,1500,900,now,0.045,0.035)}
}

/* delta between the newest snapshot and the oldest one inside a time window */
function deltaOf(arr,field,ms){
  if(!arr||arr.length<2)return null;
  var last=arr[arr.length-1],lv=last[field];if(lv==null)return null;
  var cut=new Date(last.ts).getTime()-ms,base=null;
  for(var i=0;i<arr.length-1;i++){if(new Date(arr[i].ts).getTime()>=cut){base=arr[i];break}}
  if(!base||base[field]==null)return null;
  if(new Date(last.ts).getTime()-new Date(base.ts).getTime()<20*60*1000)return null;
  return lv-base[field];
}

function audCard(c){
  var arr=W.snaps[c.id]||[],last=arr.length?arr[arr.length-1]:null,col=audCol(c.platform),yt=c.platform==="youtube";
  var fl=yt?"subscribers":"followers";
  var series=arr.map(function(s){return s.followers==null?0:Number(s.followers)});
  var d1=deltaOf(arr,"followers",864e5),d7=deltaOf(arr,"followers",7*864e5);
  var h='<article class="acard" style="--c:'+col+'" data-id="'+c.id+'"><header class="ac-h">'+
    (c.avatar_url?'<img class="ac-av" src="'+esc(c.avatar_url)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="ac-av ac-ini">'+esc((c.title||c.handle||"?").slice(0,1).toUpperCase())+'</span>')+
    '<div class="ac-t"><b>'+esc(c.title||c.handle||"Untitled")+'</b><span><i class="ac-dot"></i>'+esc(platName(c.platform))+' · '+(c.kind==="watch"?"Following":"Yours")+(c.source==="manual"?" · Typed in":"")+'</span></div>'+
    '<span class="ac-up">'+(c.status==="error"?'<span class="ac-err" title="'+esc(c.last_error||"")+'">Problem</span>':"Updated "+sinceStr(last?last.ts:c.last_synced))+'</span></header>';
  h+='<div class="ac-stats"><div><b title="'+esc(nfull(last&&last.followers))+'">'+nf(last?last.followers:null)+'</b><small>'+fl+'</small>'+deltaHTML(d1,"today")+(d7!=null&&d7!==0?'<em class="dl '+(d7>0?"up":"down")+'">'+(d7>0?"+":"-")+nf(Math.abs(d7))+' this week</em>':"")+'</div>'+
    '<div><b title="'+esc(nfull(last&&last.views))+'">'+nf(last?last.views:null)+'</b><small>total views</small>'+deltaHTML(deltaOf(arr,"views",864e5),"today")+'</div>'+
    '<div><b>'+nf(last?last.posts:null)+'</b><small>'+(yt?"videos":"posts")+'</small>'+deltaHTML(deltaOf(arr,"posts",7*864e5),"this week")+'</div></div>';
  if(series.length>1)h+='<div class="ac-sp" style="--c:'+col+'">'+spark(series)+'<small>'+series.length+' readings, last 35 days</small></div>';
  else h+='<p class="muted ac-note">Growth charts appear after a few readings. The numbers refresh while this page is open.</p>';
  if(c.kind==="own"){
    var cur=last&&last.followers!=null?Number(last.followers):null;
    if(W.goalEd===c.id){h+='<div class="ac-goal ed"><label>Follower goal<input class="in" id="ag-in" inputmode="numeric" placeholder="e.g. 10000" value="'+(c.goal||"")+'"></label><button class="btn pri sm" data-act="aud_gsave" data-id="'+c.id+'">Save goal</button><button class="btn sm" data-act="aud_gedit" data-id="">Cancel</button></div>'}
    else if(c.goal&&cur!=null){var pc=Math.max(0,Math.min(100,Math.round(cur/c.goal*100)));var rate=deltaOf(arr,"followers",7*864e5);var eta="";
      if(cur>=c.goal)eta="Goal reached";else if(rate>0){var wk=Math.ceil((c.goal-cur)/rate);eta="About "+(wk<=1?"1 week":wk<104?wk+" weeks":"2+ years")+" at this week's pace"}
      h+='<div class="ac-goal"><div class="ag-t"><span>Goal: '+nf(c.goal)+' '+fl+'</span><b>'+pc+'%</b></div><div class="ag-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'"><i style="width:'+pc+'%"></i></div><small>'+nf(cur)+' of '+nf(c.goal)+(eta?' · '+eta:'')+'</small><button class="btn sm" data-act="aud_gedit" data-id="'+c.id+'">Change</button></div>'}
    else h+='<div class="ac-goal"><button class="btn sm" data-act="aud_gedit" data-id="'+c.id+'">Set a follower goal</button></div>';
  }
  if(c.status==="error"&&c.last_error)h+='<p class="ac-errmsg">'+esc(c.last_error)+'</p>';
  var vids=(W.vids[c.id]||[]).slice(0,5);
  if(vids.length){
    h+='<div class="ac-vids"><h4>Recent videos</h4>'+vids.map(function(v){
      return '<a class="ac-v" href="https://www.youtube.com/watch?v='+esc(v.video_id)+'" target="_blank" rel="noopener noreferrer">'+(v.thumb?'<img src="'+esc(v.thumb)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="ac-vph"></span>')+
        '<span class="ac-vt">'+esc(v.title||"")+'</span><span class="ac-vn">'+nf(v.views)+' views</span><span class="ac-vn">'+nf(v.likes)+' likes</span></a>';
    }).join("")+'</div>';
  }
  if(W.manual===c.id){
    h+='<div class="ac-man"><label>Followers<input class="in" id="am-fo" inputmode="numeric" value="'+(last&&last.followers!=null?last.followers:"")+'"></label><label>Views<input class="in" id="am-vw" inputmode="numeric" value="'+(last&&last.views!=null?last.views:"")+'"></label><label>Posts<input class="in" id="am-po" inputmode="numeric" value="'+(last&&last.posts!=null?last.posts:"")+'"></label>'+
      '<button class="btn pri sm" data-act="aud_msave" data-id="'+c.id+'">Save numbers</button><button class="btn sm" data-act="aud_mcancel">Cancel</button></div>';
  }
  h+='<footer class="ac-f">';
  if(c.source==="manual"&&W.manual!==c.id)h+='<button class="btn sm" data-act="aud_man" data-id="'+c.id+'">Update numbers</button>';
  if(c.url)h+='<a class="btn sm" href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">Open</a>';
  if(c.kind==="own")h+='<label class="ac-pub"><input type="checkbox" data-act="aud_pub" data-id="'+c.id+'"'+(c.show_public?" checked":"")+'> Show on my public page</label>';
  h+='<button class="btn sm" data-act="aud_del" data-id="'+c.id+'">Remove</button></footer></article>';
  return h;
}

  var h=hero("aud","Audience",null,(W.loaded&&W.conns.length?'<button class="btn" data-act="aud_toggleadd">'+(W.showAdd?"Close":"+ Add channel")+'</button>':'')+'<button class="btn" data-act="aud_refresh"'+(W.busy?" disabled":"")+'>'+(W.busy?"Refreshing…":"Refresh numbers")+'</button>');

function audPaint(){var e=$("audlist");if(e)e.innerHTML=audListHTML()}
function audMsg(t){W.msg=t||"";var e=$("audmsg");if(e)e.textContent=W.msg}

async function audAdd(){
  var inp=$("aud-in"),v=inp?inp.value.trim():"";
  if(!v){audMsg("Paste a channel link, an @handle, or a channel ID.");return}
  W.busy=true;audMsg("Looking up the channel…");audPaintBtn();
  var r=await ytCall({input:v,kind:W.kind});
  W.busy=false;
  if(!r.ok){
    if(r.err.error==="not_configured"){W.cfg=false;audMsg("");render();return}
    audMsg(r.err.message||"Couldn't connect that channel.");audPaintBtn();return;
  }
  W.cfg=true;if(inp)inp.value="";audMsg("Connected "+(r.data.title||"channel")+".");
  await audLoad();audPaintBtn();
}
async function audAddManual(){
  var h=($("aud-h").value||"").trim(),fo=numOrNull($("aud-fo").value),vw=numOrNull($("aud-vw").value),po=numOrNull($("aud-po").value);
  if(!h){audMsg("Enter the handle or page name.");return}
  if(fo==null||isNaN(fo)||isNaN(vw)||isNaN(po)){audMsg("Enter your follower count as a number. Views and posts are optional.");return}
  var ext=h.toLowerCase().replace(/^@/,"");
  var c=await WSB.from("connections").upsert({platform:W.plat,kind:"own",handle:h,external_id:ext,title:h,source:"manual",status:"ok",last_synced:new Date().toISOString()},{onConflict:"user_id,platform,external_id"}).select("id").single();
  if(c.error){audMsg("Couldn't save that. "+c.error.message);return}
  var s=await WSB.from("snapshots").insert({connection_id:c.data.id,followers:fo,views:vw,posts:po,extra:{manual:true}});
  if(s.error){audMsg("Couldn't save the numbers. "+s.error.message);return}
  ["aud-h","aud-fo","aud-vw","aud-po"].forEach(function(i){var e=$(i);if(e)e.value=""});
  audMsg("Added "+h+".");await audLoad();
}
async function audSaveManual(id){
  var fo=numOrNull($("am-fo").value),vw=numOrNull($("am-vw").value),po=numOrNull($("am-po").value);
  if(fo==null||isNaN(fo)||isNaN(vw)||isNaN(po)){toast("Enter your follower count as a number.");return}
  var s=await WSB.from("snapshots").insert({connection_id:id,followers:fo,views:vw,posts:po,extra:{manual:true}});
  if(s.error){toast("Couldn't save the numbers");return}
  await WSB.from("connections").update({last_synced:new Date().toISOString()}).eq("id",id);
  W.manual=null;await audLoad();toast("Numbers saved");
}

function suggestHandle(){
  var base=((S.profile&&S.profile.name)||(window.__EMAIL||"").split("@")[0]||"creator").toLowerCase().replace(/[^a-z0-9_]/g,"");
  if(base.length<3)base=(base+"creator").slice(0,12);return base.slice(0,24);
}
function normKit(k){
  k=k&&typeof k==="object"?k:{};

  return {on:!!k.on,intro:String(k.intro||"").slice(0,600),email:String(k.email||"").slice(0,120),stats:pairs(k.stats,6),rates:pairs(k.rates,8),
    brands:(Array.isArray(k.brands)?k.brands:[]).slice(0,10).map(function(b){return {name:String(b&&b.name||"").slice(0,60),note:String(b&&b.note||"").slice(0,120)}})};
}
async function cpLoad(){
  try{
    var r=await WSB.from("profiles").select("*").eq("user_id",window.__UID).maybeSingle();

    W.p=d?{handle:d.handle||"",display_name:d.display_name||"",tagline:d.tagline||"",bio:d.bio||"",accent:d.accent||"#12163A",look:d.look||"plain",is_public:!!d.is_public,avatar_url:d.avatar_url||"",links:Array.isArray(d.links)?d.links:[],kit:normKit(d.kit),exists:true}
      :{handle:suggestHandle(),display_name:(S.profile&&S.profile.name)||"",tagline:"",bio:"",accent:"#111111",look:"plain",is_public:false,avatar_url:"",links:[],kit:normKit(),exists:false};
    W.pLoaded=true;W.pErr="";
    try{S.profile=S.profile||{};
      if(!W.p.avatar_url&&S.profile.avatar)W.p.avatar_url="/_blob/"+S.profile.avatar;
      else if(W.p.avatar_url&&!S.profile.avatar&&W.p.avatar_url.indexOf("/_blob/")===0){S.profile.avatar=W.p.avatar_url.slice(7);touch()}
      if(!W.p.display_name&&S.profile.name)W.p.display_name=S.profile.name;

  }catch(e){W.pErr="Couldn't load your profile. "+((e&&e.message)||"");W.pLoaded=true;if(!W.p)W.p={handle:"",display_name:"",tagline:"",bio:"",accent:"#111111",look:"plain",is_public:false,avatar_url:"",links:[],kit:normKit()}}

function hdSet(h,raw){

/* ---- motion: count numbers up when a page opens ---- */
(function(){
  var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  window.__csCount=function(root){
    if(RM||!root)return;
    root.querySelectorAll(".stat b,.kpi b,.vz-big,.pp-num").forEach(function(el){
      if(el.children.length)return;
      var t=el.textContent,m=t.match(/^(\D*)([\d,]+(?:\.\d+)?)(.*)$/);
      if(!m)return;
      var pre=m[1],raw=m[2],suf=m[3],dec=(raw.split(".")[1]||"").length,end=parseFloat(raw.replace(/,/g,""));
      if(!isFinite(end)||end<=0||end>1e12)return;
      var t0=performance.now(),dur=750;
      (function step(now){
        var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),v=end*e;
        el.textContent=k>=1?t:pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString("en-US"))+suf;
        if(k<1)requestAnimationFrame(step)
      })(t0)
    })
  };
  /* first load: play the page entrance once */
  var n=0,iv=setInterval(function(){
    var w=document.getElementById("wrap");
    if(w&&w.children.length){clearInterval(iv);w.classList.add("enter");window.__csCount(w);setTimeout(function(){w.classList.remove("enter")},900)}
    else if(++n>40)clearInterval(iv)
  },120);
})();

async function tmCreate(){
  var f=T.f,name=(f.name||"").trim(),em=(f.email||"").trim().toLowerCase(),amt=Number(String(f.amount||"0").replace(/,/g,""));
  if(!name){T.msg="Add a name first.";render();return}
  if(em&&!/^\S+@\S+\.\S+$/.test(em)){T.msg="That email doesn't look right.";render();return}
  if(em&&em===String(window.__EMAIL||"").toLowerCase()){T.msg="That is your own email.";render();return}
  if(!isFinite(amt)||amt<0){T.msg="Enter the amount as a number.";render();return}
  var row={name:name,role_title:(f.role||"").trim()||null,email:em||null,kind:f.kind,amount:amt,start_date:f.start||null,end_date:f.kind==="temp"?(f.end||null):null,can_login:!!(f.login&&em),see_pay:!!f.seepay};
  var r=await WSB.from("team_members").insert(row).select("*").single();
  if(r.error){T.msg=r.error.code==="23505"?"You already added someone with that email.":"Couldn't add them. "+r.error.message;render();return}
  T.members.push(r.data);T.form=false;T.sel=r.data.id;T.msg="";
  T.f={name:"",role:"",email:"",kind:"salary",amount:"",start:"",end:"",login:true,seepay:true};
  toast(name+" added to your team");render();
}
async function tmPatch(id,patch,rerender){
  var m=tmM(id);if(!m)return;
  var r=await WSB.from("team_members").update(patch).eq("id",id);
  if(r.error){T.msg=r.error.code==="23505"?"Someone with that email is already on your team.":"Couldn't save. "+r.error.message;render();return}
  Object.assign(m,patch);T.msg="";if(rerender)render();
}
async function tmDelete(id){
  var r=await WSB.from("team_members").delete().eq("id",id);
  if(r.error){T.msg="Couldn't remove them.";render();return}
  T.members=T.members.filter(function(x){return x.id!==id});T.work=T.work.filter(function(x){return x.member_id!==id});T.pay=T.pay.filter(function(x){return x.member_id!==id});
  if(T.sel===id)T.sel=null;toast("Removed from your team");render();
}
function tmMail(id,fb){

  var body="Hi "+m.name+",\n\nI added you to my team on Creator Space.\n\n1. Open "+location.origin+"\n2. Sign in, or create an account, with this email: "+m.email+"\n3. Open Team and choose \"My work for others\" to see your work"+(m.see_pay?", progress and pay":" and progress")+".\n\nThanks,\n"+who;
  var a=document.createElement("a");a.href="mailto:"+encodeURIComponent(m.email)+"?subject="+encodeURIComponent(who+" added you to their team")+"&body="+encodeURIComponent(body);
  document.body.appendChild(a);a.click();a.remove();
  try{navigator.clipboard&&navigator.clipboard.writeText(body).catch(function(){})}catch(e){}

async function tmPayAdd(id,salary){
  var m=tmM(id);if(!m)return;var pf=T.pf[id]||{},label,amt;
  if(salary){label=tmMonth()+" salary";amt=Number(m.amount)}
  else{label=(pf.label||"").trim();amt=Number(String(pf.amount||"").replace(/,/g,""))}

  if(r.error){T.msg="Couldn't add the payment. "+r.error.message;render();return}
  T.pay.unshift(r.data);T.pf[id]={};render();
}

document.addEventListener("input",function(e){
  var t=e.target;if(!t||!t.dataset)return;var d=t.dataset;
  if(d.tmf){T.f[d.tmf]=t.type==="checkbox"?t.checked:t.value}
  else if(d.tmw){(T.wf[d.id]=T.wf[d.id]||{})[d.tmw]=t.value}
  else if(d.tmp){(T.pf[d.id]=T.pf[d.id]||{})[d.tmp]=t.value}
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t||!t.dataset)return;var d=t.dataset;
  if(d.tmf&&t.type==="checkbox"){T.f[d.tmf]=t.checked}
  else if(d.tmf==="start"||d.tmf==="end"){T.f[d.tmf]=t.value}
  else if(d.tmws){tmWorkStatus(d.tmws,t.value)}
  else if(d.tmmy){tmMyStatus(d.tmmy,t.value)}
  else if(d.tm){
    var f=d.tm,v=t.type==="checkbox"?t.checked:t.value,patch={};
    if(f==="amount"){v=Number(String(v).replace(/,/g,""));if(!isFinite(v)||v<0){toast("Enter the amount as a number");return}}
    else if(f==="email"){v=String(v).trim().toLowerCase()||null;if(v&&!/^\S+@\S+\.\S+$/.test(v)){toast("That email doesn't look right");return}}
    else if(f==="start_date"||f==="end_date"){v=v||null}
    else if(f==="name"){v=String(v).trim();if(!v){toast("A name is needed");return}}
    else if(f==="role_title"||f==="notes"){v=String(v).trim()||null}
    patch[f]=v;tmPatch(d.id,patch,t.type==="checkbox"||f==="amount"||f==="name"||f==="email");
  }
});

/* v14: teleprompter */
var TP={on:false,run:false,y:0,speed:3,size:44,mirror:false,raf:0,last:0,lock:null,count:0};
function tpText(){var n=S.notes.filter(function(x){return x.id===selNote})[0];if(!n)return "";
  return (n.title?n.title+"\n\n":"")+String(n.body||"").replace(/^#{1,6}\s*/gm,"").replace(/^\s*[-*]\s+\[[ xX]\]\s*/gm,"").replace(/^\s*[-*]\s+/gm,"• ").replace(/^---+$/gm,"")}
function tpOpen(){
  var t=tpText();if(!t.trim()){toast("Write something in this note first");return}
  try{var pr=JSON.parse(localStorage.getItem("cs-tp")||"{}");if(pr.speed)TP.speed=pr.speed;if(pr.size)TP.size=pr.size;TP.mirror=!!pr.mirror}catch(e){}
  var el=$("tp");if(!el){el=document.createElement("div");el.id="tp";el.className="tp";document.body.appendChild(el)}
  TP.on=true;TP.run=false;TP.y=0;TP.count=0;
  el.innerHTML='<div class="tp-view" id="tpview"><div class="tp-text" id="tptext"></div></div><div class="tp-line"></div><div class="tp-count" id="tpcount" hidden></div>'+
    '<div class="tp-bar"><button class="tp-b" data-act="tp_close" aria-label="Close">'+I("x")+'</button><button class="tp-b" data-act="tp_restart" aria-label="Back to start">'+I("undo")+'</button>'+
    '<span class="tp-g"><button class="tp-b" data-act="tp_speed" data-d="-1" aria-label="Slower">'+I("minus")+'</button><span id="tpsp" class="tp-v"></span><button class="tp-b" data-act="tp_speed" data-d="1" aria-label="Faster">'+I("plus")+'</button></span>'+
    '<button class="tp-play" data-act="tp_play" id="tpplay" aria-label="Play">'+I("play")+'</button>'+
    '<span class="tp-g"><button class="tp-b" data-act="tp_size" data-d="-4" aria-label="Smaller text">A−</button><button class="tp-b" data-act="tp_size" data-d="4" aria-label="Bigger text">A+</button></span>'+
    '<button class="tp-b" data-act="tp_mirror" id="tpmir" aria-label="Mirror">⇋</button></div>';
  $("tptext").textContent=t;el.hidden=false;document.documentElement.classList.add("tp-open");tpPaint();tpApply();
}
function tpSave(){try{localStorage.setItem("cs-tp",JSON.stringify({speed:TP.speed,size:TP.size,mirror:TP.mirror}))}catch(e){}}
function tpPaint(){var t=$("tptext");if(!t)return;t.style.fontSize=TP.size+"px";$("tpview").classList.toggle("mir",TP.mirror);$("tpmir").setAttribute("aria-pressed",TP.mirror);$("tpsp").textContent="Speed "+TP.speed;$("tpplay").innerHTML=I(TP.run?"pause":"play");$("tpplay").setAttribute("aria-label",TP.run?"Pause":"Play");tpSave()}
function tpApply(){var t=$("tptext");if(t)t.style.transform="translateY("+(-TP.y)+"px)"}
function tpSpeed(d){TP.speed=Math.max(1,Math.min(10,TP.speed+d));tpPaint()}
function tpSize(d){TP.size=Math.max(24,Math.min(96,TP.size+d));tpPaint()}
function tpStep(ts){
  if(!TP.run)return;var dt=TP.last?Math.min(100,ts-TP.last):16;TP.last=ts;
  var t=$("tptext"),v=$("tpview");if(!t||!v){TP.run=false;return}
  TP.y+=TP.speed*TP.size*0.012*dt/16;var max=t.scrollHeight-v.clientHeight*0.3;
  if(TP.y>=max){TP.y=max;TP.run=false;tpPaint()}
  tpApply();if(TP.run)TP.raf=requestAnimationFrame(tpStep);
}
function tpToggle(){
  if(TP.run){TP.run=false;cancelAnimationFrame(TP.raf);tpPaint();return}
  var c=$("tpcount");if(TP.count)return;
  if(TP.y===0&&c){TP.count=3;c.hidden=false;c.textContent="3";var iv=setInterval(function(){TP.count--;if(TP.count>0){c.textContent=String(TP.count)}else{clearInterval(iv);c.hidden=true;tpGo()}},800);return}
  tpGo();
}
function tpGo(){TP.count=0;TP.run=true;TP.last=0;tpPaint();TP.raf=requestAnimationFrame(tpStep);try{if(navigator.wakeLock&&!TP.lock)navigator.wakeLock.request("screen").then(function(l){TP.lock=l}).catch(function(){})}catch(e){}}
function tpClose(){TP.on=false;TP.run=false;cancelAnimationFrame(TP.raf);var el=$("tp");if(el){el.hidden=true;el.innerHTML=""}document.documentElement.classList.remove("tp-open");try{if(TP.lock){TP.lock.release();TP.lock=null}}catch(e){}}
document.addEventListener("keydown",function(e){
  if(!TP.on)return;
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();tpClose()}
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();e.stopPropagation();tpToggle()}
  else if(e.key==="ArrowUp"){e.preventDefault();tpSpeed(1)}
  else if(e.key==="ArrowDown"){e.preventDefault();tpSpeed(-1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();TP.y=Math.max(0,TP.y-TP.size*3);tpApply()}
  else if(e.key==="ArrowRight"){e.preventDefault();TP.y+=TP.size*3;tpApply()}
},true);
document.addEventListener("click",function(e){if(TP.on&&e.target&&e.target.closest&&e.target.closest("#tpview"))tpToggle()});
document.addEventListener("wheel",function(e){if(TP.on&&e.target.closest&&e.target.closest("#tpview")){TP.y=Math.max(0,TP.y+e.deltaY);tpApply()}},{passive:true});
