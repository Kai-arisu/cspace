name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', 'README.md']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build must match the committed public/ folder
        run: |
          pip install pillow >/dev/null
          python3 build.py
          git diff --exit-code -- public/index.html public/sw.js || (echo "public/ is out of date. Run python3 build.py and commit." && exit 1)
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run test suites
        run: |
          fail=0
          for t in audit3 audit4 audit5 audit6 audit7 search kit share scope team wbframe rail motion look calsync invitemail push t19 t20 notify onboard isobell offline profile creator social mid; do
            echo "== $t"
            node tests/$t.js >/tmp/$t.log 2>&1 && echo "ok" || { echo "::error::$t failed"; tail -30 /tmp/$t.log; fail=1; }
          done
          exit $fail
