    <rect x="192" y="92" width="132" height="246" rx="16" fill="#ffffff"/>
    <circle class="ill-rec" cx="258" cy="200" r="46" fill="#ffc21a" stroke="#1c1a17" stroke-width="6"/>
    <circle cx="258" cy="200" r="20" fill="#1c1a17"/>
    <rect x="216" y="270" width="84" height="10" rx="5" fill="#1c1a17"/>
