  <rect x="158" y="276" width="38" height="22" rx="11" fill="#a8693f"/>
  <rect x="162" y="302" width="34" height="22" rx="11" fill="#a8693f"/>
  <rect x="320" y="270" width="34" height="24" rx="12" fill="#a8693f"/>
