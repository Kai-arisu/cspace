  <circle cx="260" cy="260" r="250" fill="#ffc21a"/>
  <circle cx="260" cy="260" r="190" fill="url(#ct)" opacity=".18"/>
  <!-- sleeve + arm from below -->
  <path d="M150 520 L196 380 L300 380 L330 520 Z" fill="#1c1a17"/>
  <path d="M196 380 Q182 330 206 300 L292 300 Q312 330 300 380 Z" fill="#a8693f"/>
