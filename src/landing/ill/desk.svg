<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" class="ill ill-desk" role="img" aria-label="Illustration: a creator's desk from above, with a laptop playing a video, a notebook checklist, a phone, a pencil and a glass of chai">
  <defs><pattern id="dk" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.1" fill="#1c1a17"/></pattern></defs>
  <!-- laptop -->
  <g class="dk-laptop" transform="rotate(-6 250 190)">
    <rect x="70" y="60" width="360" height="250" rx="22" fill="#1c1a17"/>
    <rect x="88" y="78" width="324" height="196" rx="10" fill="#ffffff"/>
    <circle cx="250" cy="176" r="52" fill="#ffc21a" stroke="#1c1a17" stroke-width="5"/>
    <path d="M236 150 L278 176 L236 202 Z" fill="#1c1a17"/>
    <rect x="108" y="250" width="284" height="8" rx="4" fill="#e3e3e0"/>
    <rect x="108" y="250" width="170" height="8" rx="4" fill="#1c1a17"/>
    <circle cx="278" cy="254" r="9" fill="#ffc21a" stroke="#1c1a17" stroke-width="3"/>
    <rect x="40" y="306" width="420" height="34" rx="17" fill="#1c1a17"/>
    <rect x="200" y="314" width="100" height="10" rx="5" fill="#ffffff"/>
  </g>
  <!-- notebook with checklist -->
  <g class="dk-book" transform="rotate(7 170 500)">
    <rect x="44" y="388" width="250" height="250" rx="14" fill="#ffffff" stroke="#1c1a17" stroke-width="5"/>
    <rect x="44" y="388" width="30" height="250" rx="10" fill="url(#dk)"/>
    <g stroke="#1c1a17" stroke-width="5" stroke-linecap="round" fill="none">
      <circle cx="108" cy="440" r="13"/><path d="M101 440 L107 447 L117 433"/>
      <circle cx="108" cy="496" r="13"/><path d="M101 496 L107 503 L117 489"/>
      <circle cx="108" cy="552" r="13"/>
    </g>
    <rect x="134" y="434" width="120" height="11" rx="5.5" fill="#1c1a17"/>
    <rect x="134" y="490" width="96" height="11" rx="5.5" fill="#1c1a17"/>
    <rect x="134" y="546" width="130" height="11" rx="5.5" fill="#e3e3e0"/>
    <rect x="134" y="596" width="70" height="11" rx="5.5" fill="#e3e3e0"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(-38 330 470)">
    <rect x="250" y="458" width="170" height="24" rx="4" fill="#ffc21a" stroke="#1c1a17" stroke-width="4"/>
    <path d="M420 458 L452 470 L420 482 Z" fill="#ffffff" stroke="#1c1a17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M442 466 L452 470 L442 474 Z" fill="#1c1a17"/>
    <rect x="238" y="458" width="16" height="24" rx="3" fill="#1c1a17"/>
  </g>
  <!-- phone -->
  <g class="dk-phone" transform="rotate(14 430 560)">
    <rect x="378" y="470" width="110" height="196" rx="20" fill="#1c1a17"/>
    <rect x="388" y="486" width="90" height="160" rx="10" fill="#ffc21a"/>
    <rect x="400" y="500" width="66" height="66" rx="33" fill="#ffffff"/>
    <rect x="400" y="580" width="66" height="9" rx="4.5" fill="#1c1a17"/>
    <rect x="400" y="598" width="44" height="9" rx="4.5" fill="#1c1a17"/>
    <text x="433" y="540" text-anchor="middle" font-family="Jost, sans-serif" font-weight="600" font-size="20" fill="#1c1a17">9.1K</text>
  </g>
  <!-- chai glass, top view: two circles and a saucer -->
  <g class="dk-chai">
    <circle cx="470" cy="360" r="58" fill="#ffffff" stroke="#1c1a17" stroke-width="5"/>
    <circle cx="470" cy="360" r="38" fill="#a8693f"/>
    <circle cx="470" cy="360" r="38" fill="url(#dk)" opacity=".35"/>
    <path class="ill-steam" d="M500 300 Q488 286 500 272 Q512 258 500 244" fill="none" stroke="#1c1a17" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
